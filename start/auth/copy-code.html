<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Copy your code · Fuse Atelier</title><style>body{margin:0;background:#00191b;color:#eeffe0;font:16px Arial,sans-serif;display:grid;place-items:center;min-height:100svh}main{width:min(86%,400px);text-align:center}input{box-sizing:border-box;width:100%;background:#062125;color:#dfff4e;border:1px solid #315456;border-radius:12px;padding:18px;font-size:28px;letter-spacing:5px;text-align:center}button{width:100%;margin-top:18px;padding:16px;border:0;border-radius:12px;background:#dfff4e;color:#00191b;font-weight:bold;font-size:17px;cursor:pointer}p{line-height:1.6}#status{min-height:50px}</style></head><body><main><h1>Copy your verification code</h1><input id="code" aria-label="Verification code" readonly autocomplete="off"><button id="copy" type="button">Copy code</button><p id="status" role="status" aria-live="polite">Then return to your original signup tab and paste the code.</p><p>Never share your code.</p></main><script>
const code=new URLSearchParams(location.hash.slice(1)).get('code')||'';
history.replaceState(null,'',location.pathname);
const field=document.getElementById('code'),button=document.getElementById('copy'),status=document.getElementById('status');
if(!/^\d{6,10}$/.test(code)){field.hidden=true;button.disabled=true;status.textContent='Open Copy code from your newest Fuse Atelier email.';}else{field.value=code;button.onclick=async()=>{try{await navigator.clipboard.writeText(code);button.textContent='Copied!';status.textContent='Return to your original signup tab, paste the code, then tap Verify code.';}catch{field.focus();field.select();field.setSelectionRange(0,code.length);status.textContent='Press and hold the selected code, choose Copy, then return to your signup tab.';}};}
</script></body></html>
