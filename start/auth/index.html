<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Join Fuse Atelier</title><link rel="stylesheet" href="/start/start.css"><style>body{min-height:100svh;display:grid;place-items:center}.auth-card{width:min(440px,calc(100% - 36px));padding:35px 25px;border:1px solid #315456;border-radius:24px;margin:30px auto;background:#02141899;text-align:center}.brand{justify-content:center}.auth-card h1{font-size:32px;letter-spacing:-1px;margin-top:32px}.auth-card p{font-size:13px;line-height:1.8;color:#b0c4bf}.auth-card label{display:block;text-align:left;margin-top:22px;font-size:13px}.auth-card input{width:100%;padding:16px;margin-top:9px;border:1px solid #315456;border-radius:12px;background:#062125;color:white;font:inherit;font-size:15px}.auth-card .button{width:100%;border:0;justify-content:center;margin-top:25px;cursor:pointer}.auth-card .button:disabled{opacity:.6;cursor:wait}.auth-card a:not(.brand){text-decoration:underline;text-underline-offset:4px}#message{min-height:24px}#switch{display:block;margin-top:15px;font-size:13px;color:#eef4bd}.auth-card .marketing-choice{display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.6;color:#b0c4bf;margin-top:20px}.auth-card .marketing-choice input{width:18px;height:18px;min-width:18px;margin:3px 0 0;padding:0;accent-color:#eaf4b7}.auth-card .marketing-choice span{flex:1}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script><script src="/start/auth/auth.js" defer></script></head><body><main class="auth-card"><a class="brand" href="/start"><img src="/atelier-v2/media/fuse-mark-login-exact.png" width="40" height="40" alt="">Fuse Atelier</a><h1 class="chrome-text" id="title">Create your account</h1><p id="description">Enter your name and email. We’ll send a verification button to your inbox.</p><form id="auth-form"><label for="name">Your name<input id="name" name="name" autocomplete="name" maxlength="120" required></label><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></label><label class="marketing-choice"><input id="marketingOptIn" type="checkbox"><span>Email me Fuse tutorials, updates and offers. I can unsubscribe anytime.</span></label><button class="button primary" id="submit">Send verification email</button><p id="message" role="status" aria-live="polite"></p></form><a id="switch" href="/login">Already a member? Log in</a><p>Studio generation uses credits. Purchased courses stay linked to your account.</p></main></body></html>
