function home(){
 return `<section class="hero"><div class="eyebrow">Fuse Academy</div><h1>Learn something <em>you can sell.</em></h1><p>Short, practical learning paths that end in portfolio-ready work, an offer you can package and a clear next move toward a client.</p><label class="academy-search"><input id="academySearch" placeholder="What do you want to learn?"></label></section>
 <div class="tabs"><button class="active">For you</button><button onclick="go('explore')">Paths</button><button onclick="document.getElementById('quick')?.scrollIntoView()">Quick wins</button><button onclick="go('explore')">Explore</button></div>
 <section class="section"><div class="head"><div><div class="eyebrow">Continue learning</div><h2>Your next money-making skill</h2></div><span class="more">58% complete</span></div><article class="card continue-card"><div class="continue-media">${media(courses[0])}<span class="continue-badge">IN PROGRESS</span></div><div class="continue-copy"><h3>${courses[0].title}</h3><p>Finish the build, export a client-ready sample and turn it into a starter offer.</p><div class="progress-line"><i></i></div><div class="progress-meta"><span>5 of 8 lessons</span><span>18 min left</span></div><div class="finish-box"><span>✓ 3 UGC samples</span><span>✓ Offer template</span><span>✓ Pitch template</span></div><div class="cta-row"><button class="primary" onclick="go('lesson','ugc')">Continue lesson →</button><button class="secondary" onclick="go('course','ugc')">Overview</button></div></div></article></section>
 <section class="section"><div class="head"><div><div class="eyebrow">Choose a skill</div><h2>What do you want to get good at?</h2></div><span class="more" onclick="go('explore')">See all →</span></div><div class="rail">${courses.slice(0,6).map(c=>`<article class="skill-card" onclick="go('course','${c.id}')"><div class="skill-media">${media(c)}<span class="skill-tag">${c.cat.toUpperCase()}</span></div><div class="skill-copy"><h3>${c.title.replace(/ —.*/,'')}</h3><p>${c.desc}</p><span class="earn-chip">${c.sell}</span></div></article>`).join('')}</div></section>
 <section class="section"><div class="head"><div><div class="eyebrow">Your path</div><h2>Learn → Create → Sell</h2></div><span class="more">Recommended</span></div>${[['01','AI UGC','Build your first client-ready sample','Current'],['02','Package the offer','Turn the sample into a service people understand','Next'],['03','Get Your First Client','Build a prospect list and pitch the right people','Then']].map((r,i)=>`<article class="card path-card ${i>1?'locked':''}"><div class="path-num">${r[0]}</div><div class="path-copy"><h3>${r[1]}</h3><p>${r[2]}</p><div class="meta"><span>${r[3]}</span><span>·</span><span>${i===0?'58%':'Not started'}</span></div></div><button class="path-go" onclick="go('${i===2?'course':'course'}','${i===2?'client':'ugc'}')">→</button></article>`).join('')}</section>
 <section class="section" id="quick"><div class="head"><div><div class="eyebrow">Quick wins</div><h2>Learn it in 10 minutes.</h2></div><span class="more">Fast practice</span></div><div class="quick-grid">${[['Impossible-angle fashion',vids[7],'08 min'],['Luxury product hero',vids[18],'09 min'],['Realistic creator UGC',vids[1],'07 min'],['AI flyer hero visual',vids[12],'10 min']].map(r=>`<article class="card quick-card" onclick="go('lesson','ugc')"><div class="quick-media"><video src="${r[1]}" muted autoplay loop playsinline preload="metadata"></video><span class="duration">${r[2]}</span></div><div class="quick-copy"><b>${r[0]}</b><span>Watch → Build → Save</span></div></article>`).join('')}</div></section>
 <section class="section"><article class="card sell-card"><div class="eyebrow">Learn → Earn</div><h2>Don't stop at “I know how.”</h2><p>Every serious Academy path ends with proof of work, a clear offer and the next client action.</p><div class="sell-steps"><div class="sell-step"><i>1</i><b>Build proof</b><span>Finish a real sample.</span></div><div class="sell-step"><i>2</i><b>Package it</b><span>Turn it into a service.</span></div><div class="sell-step"><i>3</i><b>Find buyers</b><span>Move into Fuse Client.</span></div></div><button class="primary" style="margin-top:12px" onclick="go('course','client')">See client path →</button></article></section>`;
}
function explore(){return `<div class="explore-head"><div class="eyebrow">Explore Academy</div><h1 style="font-size:32px;letter-spacing:-.05em;margin:7px 0 5px">Choose a path. Finish with an outcome.</h1><p style="font-size:10px;color:var(--muted);line-height:1.45">Courses, quick wins and workflows built around real creative and client work.</p><div class="chips"><button class="chip active">All</button><button class="chip">Video</button><button class="chip">Photography</button><button class="chip">UGC</button><button class="chip">Design</button><button class="chip">Clients</button></div></div><div class="course-grid">${courses.map(courseCard).join('')}</div>`}
function courseCard(c){return `<article class="card course-card"><div class="course-media">${media(c)}<span class="course-level">${c.level.toUpperCase()}</span></div><div class="course-copy"><h3>${c.title}</h3><p>${c.desc}</p><div class="course-info"><span>${c.cat}</span><span>· ${c.lessons} lessons</span><span>· ${c.time}</span></div><div class="outcome"><span>Build: ${c.build}</span><b>${c.sell}</b></div><div class="course-actions"><button class="primary" onclick="go('course','${c.id}')">View path</button><button class="secondary" onclick="go('lesson','${c.id}')">Start</button></div></div></article>`}
function course(id){const c=courses.find(x=>x.id===id)||courses[0];const m=modules[c.id]||modules.ugc;return `<article class="card course-hero"><div class="course-hero-media">${media(c)}<button class="back-btn" onclick="history.back()">←</button></div><div class="course-hero-copy"><div class="eyebrow">${c.cat} · ${c.level}</div><h1>${c.title}</h1><p>${c.desc}</p><div class="course-info"><span>${c.lessons} lessons</span><span>· ${c.time}</span><span>· Project included</span></div><div class="build-box"><b>What you'll finish with</b><p>${c.build} + a sellable service package + a clear next client action.</p></div><div class="cta-row"><button class="primary" onclick="go('lesson','${c.id}')">Start learning →</button><button class="secondary" onclick="openCreate()">Open Create ✦</button></div></div></article><section class="section"><div class="head"><div><div class="eyebrow">Curriculum</div><h2>Build it in sequence.</h2></div><span class="more">${c.time}</span></div>${m.map((mod,mi)=>`<article class="card module"><div class="module-head"><b>${String(mi+1).padStart(2,'0')} · ${mod[0]}</b><span>${mod[1].length} lessons</span></div>${mod[1].map((l,li)=>`<div class="lesson-row" onclick="go('lesson','${c.id}')"><div class="lesson-icon">${mi===0&&li===0?'▶':'✓'}</div><div><b>${l}</b><small>${5+((mi+li)%5)} min · Build-along</small></div><em>${mi===0&&li===0?'Start':'Open'}</em></div>`).join('')}</article>`).join('')}</section><section class="section"><article class="card sell-card"><div class="eyebrow">At the end</div><h2>You've learned it. Then you sell it.</h2><p>Fuse will turn the finished project into a starter offer and show the best prospect types to pitch.</p><button class="primary" style="margin-top:8px" onclick="go('complete','${c.id}')">Preview sell screen →</button></article></section>`}
function lesson(id){const c=courses.find(x=>x.id===id)||courses[0];return `<div class="player-wrap"><div class="player">${media(c)}<div class="player-grad"></div><div class="player-top"><button onclick="history.back()">←</button><span>Lesson 4 of ${c.lessons}</span></div></div></div><div class="lesson-title"><div class="eyebrow">${c.title}</div><h1>Create the client-ready hero.</h1><p>Follow along, use the exact working prompt, then send your result straight into Fuse Create without leaving the learning flow.</p></div><div class="lesson-tabs"><button class="active" data-tab="lesson">Lesson</button><button data-tab="prompts">Prompts</button><button data-tab="files">Files</button><button data-tab="notes">Notes</button></div><div class="lesson-panel" id="lessonPanel"><article class="card prompt-card"><span class="time">PROMPT USED · 03:18</span><p>Create a premium commercial hero visual with controlled lighting, accurate product geometry, intentional negative space and a single dominant visual idea. Preserve brand details and make the output feel campaign-ready rather than generically AI-generated.</p><div class="prompt-actions"><button class="secondary" onclick="navigator.clipboard?.writeText(this.closest('.prompt-card').querySelector('p').textContent)">Copy prompt</button><button class="primary" onclick="openCreate()">Use in Fuse Create ✦</button></div></article><article class="card task-card"><div class="eyebrow">Your move</div><h3>Build one version now.</h3><p>Don't just watch. Create the hero visual, save it to your work and return to complete the lesson.</p><div class="cta-row"><button class="primary" onclick="openCreate()">Create in Fuse ✦</button><button class="secondary" onclick="go('complete','${c.id}')">Mark complete</button></div></article></div>`}
function complete(id){const c=courses.find(x=>x.id===id)||courses[0];return `<article class="card complete-card"><div class="complete-orb">✓</div><div class="eyebrow" style="margin-top:10px">Path complete</div><h2>You've learned it. Now sell it.</h2><p>Your project is ready to become proof of work. Fuse can package the service and move you directly toward buyers.</p></article><article class="card offer-card"><div class="eyebrow">Suggested starter offer</div><h2 style="font-size:22px;margin:6px 0">${c.cat} Starter Package</h2><div class="offer-price">${c.sell.split('·')[1]||'$150–$500'}</div><div class="offer-grid"><div class="mini"><b>Deliverable</b><span>${c.build}</span></div><div class="mini"><b>Best buyers</b><span>Beauty · fashion · ecommerce · creators</span></div><div class="mini"><b>Positioning</b><span>Fast campaign-ready creative without a physical production team.</span></div><div class="mini"><b>Next move</b><span>Build 20 qualified prospects and personalize the pitch.</span></div></div><div class="cta-row"><button class="primary" onclick="alert('Offer Builder will open here.')">Build my offer →</button><button class="secondary" onclick="go('course','client')">Find prospects</button></div></article>`}
function render(){const [view='home',id]=location.hash.replace('#','').split('/');const app=document.getElementById('app');app.innerHTML=view==='explore'?explore():view==='course'?course(id):view==='lesson'?lesson(id):view==='complete'?complete(id):home();bind();window.scrollTo({top:0});}
function bind(){document.querySelectorAll('.lesson-tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.lesson-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const p=document.getElementById('lessonPanel');if(b.dataset.tab==='prompts')p.innerHTML=`<article class="card prompt-card"><span class="time">PROMPT LIBRARY</span><p>Use the lesson prompt as a starting point, then change only the subject, environment and desired commercial outcome. Keep lighting, composition and fidelity instructions stable.</p><div class="prompt-actions"><button class="secondary">Copy</button><button class="primary" onclick="openCreate()">Open in Create ✦</button></div></article>`;if(b.dataset.tab==='files')p.innerHTML=`<article class="card file-row"><i>↧</i><div><b>Client brief template</b><span>PDF · 1 page</span></div><span>Download</span></article><article class="card file-row"><i>↧</i><div><b>Prompt checklist</b><span>TXT · Copy-ready</span></div><span>Open</span></article>`;if(b.dataset.tab==='notes')p.innerHTML=`<article class="card prompt-card"><span class="time">YOUR NOTES</span><p style="color:var(--muted)">Notes you save during the lesson will live here and stay attached to this skill path.</p><textarea style="width:100%;min-height:110px;background:#041713;border:1px solid #285247;border-radius:12px;color:#fff;padding:10px;resize:none" placeholder="Write a note…"></textarea></article>`;if(b.dataset.tab==='lesson')render();});
 const search=document.getElementById('academySearch');if(search)search.addEventListener('keydown',e=>{if(e.key==='Enter')go('explore')});}
const avatarBtn=document.getElementById('avatarBtn'),profileMenu=document.getElementById('profileMenu'),profileBackdrop=document.getElementById('profileBackdrop'),profileNav=document.getElementById('profileNav');function toggleProfile(force){const open=force??!profileMenu.classList.contains('open');profileMenu.classList.toggle('open',open);profileBackdrop.classList.toggle('open',open)}avatarBtn.onclick=()=>toggleProfile();profileNav.onclick=()=>toggleProfile();profileBackdrop.onclick=()=>toggleProfile(false);window.addEventListener('hashchange',render);render();
</script>
</body>
</html>
