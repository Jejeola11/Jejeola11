<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit creator video · Fuse Earn</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script><link rel="stylesheet" href="fuse.css?v=footer-earn-1"><script src="fuse-shell.js?v=wealth-1" defer></script><style>body{font-family:Montserrat;background:#001012;color:#eeffe0}.wrap{max-width:620px;margin:auto;padding:24px 16px 110px}.card{background:#062125;border:1px solid transparent;border-radius:22px;padding:24px;background:linear-gradient(#062125,#062125) padding-box,linear-gradient(135deg,#ffe66a,#dfff4e,#eeffe0) border-box;box-shadow:0 16px 35px #0006}.k{color:#dfff4e;letter-spacing:1.5px;font-weight:700;font-size:12px}.h{font-size:27px;margin:10px 0}.sub{color:#b7cbc8;line-height:1.55}.field{margin:18px 0}.field label{display:block;color:#eeffe0;font-size:13px;margin-bottom:8px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;background:#00191b;border:1px solid #315456;border-radius:12px;padding:14px;color:#eeffe0;font:500 14px Montserrat}.field textarea{min-height:100px;resize:vertical}.primary{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(110deg,#ffe66a,#dfff4e,#eeffe0);font:700 16px Montserrat;color:#001012}.notice{margin-top:16px;color:#b7cbc8;font-size:12px;line-height:1.5}.success{display:none;text-align:center;padding:22px}.success h2{color:#dfff4e}</style></head><body data-page="earn"><div data-fuse-header></div><main class="wrap"><section class="card"><div id="formState"><div class="k">CREATOR SUBMISSION</div><h1 class="h">Submit a creator video</h1><p class="sub">Share a public Fuse promotional video for review. Approved videos can earn from verified views.</p><form id="submissionForm"><div class="field"><label>Platform</label><select id="platform" required><option value="">Choose a platform</option><option>Instagram</option><option>TikTok</option><option>YouTube</option><option>X</option><option>Facebook</option><option>Other</option></select></div><div class="field"><label>Public post URL</label><input id="postUrl" type="url" placeholder="https://..." required></div><div class="field"><label>Current public views</label><input id="views" type="number" min="0" placeholder="0" required></div><div class="field"><label>Notes (optional)</label><textarea id="notes" placeholder="Tell us what this video covers"></textarea></div><div class="field"><label><input id="consent" type="checkbox" required> I used approved Fuse branding and disclosure, and will keep this post live for 30 days.</label></div><button class="primary" type="submit">Send video for review</button></form><p class="notice" id="message"></p></div><div id="success" class="success"><div class="k">SUBMISSION RECEIVED</div><h2>We’ll review your video</h2><p class="sub">Your submission is now in the review queue. We’ll update your dashboard when it is approved.</p><a class="primary" href="affiliate-dashboard.html">Back to dashboard</a></div></section></main><script>window.addEventListener('load',()=>{submissionForm.addEventListener('submit',async e=>{e.preventDefault();message.textContent='Sending…';try{const sb=await Fuse.client(),s=await Fuse.session();if(!s?.user)throw Error('Please sign in first.');const u=s.user;const {error}=await sb.from('creator_submissions').insert({user_id:u.id,full_name:u.user_metadata?.full_name||u.email?.split('@')[0]||'Creator',email:u.email,platform:platform.value,post_url:postUrl.value,views:Number(views.value||0),content_type:'promotional_video',notes:notes.value||null});if(error)throw error;formState.style.display='none';success.style.display='block';}catch(err){message.textContent=err.message||'Could not submit. Please try again.';}})});</script><script>window.addEventListener('load',()=>{const close=document.querySelector('.program-close');if(close)close.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();location.href='affiliate-dashboard.html';},true);});</script></body></html>
