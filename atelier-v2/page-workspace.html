<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#001012">
  <title>Fuse Pages · Website Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <style>
    :root{--deep:#001012;--mid:#00191B;--surface:#062125;--line:#315456;--muted:#a9bcba;--chrome:linear-gradient(105deg,#FFE66A,#DFFF4E 54%,#EEFFE0)}
    *{box-sizing:border-box}html{background:var(--deep)}body{margin:0;min-height:100svh;padding-bottom:calc(96px + env(safe-area-inset-bottom));color:#fff;font-family:Montserrat,Arial,sans-serif;background:radial-gradient(circle at 92% 4%,rgba(27,76,82,.55),transparent 28%),linear-gradient(145deg,#001012,#00191B 70%,#0c3033)}
    button,a{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:14px 0 30px}.top{min-height:58px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid rgba(238,255,224,.12);border-radius:20px;background:rgba(6,33,37,.72);backdrop-filter:blur(16px)}.back{width:38px;height:38px;border:1px solid var(--line);border-radius:13px;display:grid;place-items:center;color:#fff;text-decoration:none;font-size:22px;font-weight:300}.brand{display:flex;justify-content:center;align-items:center;gap:8px;min-width:0}.brand img{width:28px;height:28px;border-radius:9px}.brand strong{font-size:21px;font-weight:500;letter-spacing:-.6px;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}.status{min-height:32px;padding:0 10px;border:1px solid rgba(223,255,78,.25);border-radius:999px;display:flex;align-items:center;color:#c5d5d3;font-size:11px;white-space:nowrap}
    .loading{min-height:calc(100svh - 190px);display:grid;place-items:center;text-align:center}.loading img{width:76px;height:76px;border-radius:23px;box-shadow:0 0 42px rgba(223,255,78,.27);animation:fusePulse 1s ease-in-out infinite alternate}.loading strong{display:block;margin-top:18px;font-size:17px;font-weight:500}.loading span{display:block;margin-top:8px;color:var(--muted);font-size:12px;font-weight:300}@keyframes fusePulse{from{transform:scale(.91);filter:brightness(.9)}to{transform:scale(1.08);filter:brightness(1.2)}}
    .workspace{display:grid;grid-template-columns:minmax(270px,.75fr) minmax(0,1.25fr);gap:14px;margin-top:18px}.card{border:1px solid var(--line);border-radius:24px;background:rgba(6,33,37,.8);box-shadow:0 18px 48px rgba(0,0,0,.16)}.design{padding:20px}.eyebrow{margin:0;color:#DFFF4E;font-size:10px;font-weight:600;letter-spacing:.12em}.design h1{margin:9px 0 8px;font-size:26px;line-height:1.08;letter-spacing:-.8px;font-weight:500}.design p{margin:0;color:#b8cac8;font-size:13px;line-height:1.55;font-weight:300}.section{margin-top:24px}.section h2{margin:0 0 10px;font-size:13px;font-weight:500}.palette{display:flex;gap:8px}.swatch{min-width:0;flex:1;height:68px;border-radius:15px;padding:8px;border:1px solid rgba(238,255,224,.14);display:flex;align-items:end;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);font-size:9px;font-weight:500;overflow:hidden}.style{padding:14px;border:1px solid rgba(49,84,86,.9);border-radius:16px;background:#00191B}.style strong{display:block;font-size:14px;font-weight:500}.style span{display:block;margin-top:5px;color:#9db2b0;font-size:11px;line-height:1.45}.brief{margin-top:16px;padding-top:16px;border-top:1px solid rgba(49,84,86,.65);color:#91a7a5;font-size:11px;line-height:1.5;white-space:pre-wrap}
    .preview{padding:10px;min-width:0}.preview-top{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:5px 4px 12px}.preview-top strong{font-size:13px;font-weight:500}.preview-top span{color:#95aaa8;font-size:10px}.download{min-height:36px;padding:0 12px;border:0;border-radius:11px;background:var(--chrome);color:#001012;font-size:11px;font-weight:600;white-space:nowrap}.site-frame{width:100%;height:min(72svh,760px);border:1px solid rgba(49,84,86,.9);border-radius:18px;background:#fff;display:block}.error{margin:25px 0;padding:16px;border:1px solid rgba(255,130,110,.36);border-radius:16px;background:rgba(255,110,90,.08);color:#ffd2c9;font-size:13px;line-height:1.5}
    @media(max-width:720px){.workspace{grid-template-columns:1fr}.wrap{width:calc(100% - 22px)}.top{border-radius:18px}.status{font-size:10px;padding:0 8px}.design{padding:17px}.design h1{font-size:23px}.preview{padding:8px}.site-frame{height:70svh}.palette{gap:6px}.swatch{height:58px;padding:6px;font-size:8px}}
  </style>
</head>
<body data-page="create">
  <main class="wrap">
    <header class="top">
      <a class="back" href="page-create.html" aria-label="Back to website builder">×</a>
      <div class="brand"><img src="media/fuse-mark-palette.webp" alt=""><strong>Fuse Pages</strong></div>
      <span class="status" id="status">Building</span>
    </header>
    <section class="loading" id="loading"><div><img src="media/fuse-mark-palette.webp" alt=""><strong>Fuse Atelier is building</strong><span>Creating your design direction</span></div></section>
    <section class="workspace" id="workspace" hidden>
      <aside class="card design">
        <p class="eyebrow">DESIGN DIRECTION</p>
        <h1 id="siteName">Your website</h1>
        <p id="summary">A clear direction for your website.</p>
        <div class="section"><h2>Colour palette</h2><div class="palette" id="palette"></div></div>
        <div class="section"><h2>Design style</h2><div class="style"><strong id="styleTitle">Modern editorial</strong><span id="styleText">Clean, refined and conversion-focused.</span></div></div>
        <div class="brief" id="brief"></div>
      </aside>
      <section class="card preview">
        <div class="preview-top"><div><strong>Website preview</strong><span id="projectMeta"></span></div><button class="download" id="download" type="button">Download HTML</button></div>
        <iframe class="site-frame" id="siteFrame" title="Your generated website" sandbox="allow-scripts allow-same-origin"></iframe>
      </section>
    </section>
    <div class="error" id="error" hidden></div>
  </main>
  <script>
    const q=new URLSearchParams(location.search);const stored=sessionStorage.getItem('fuse_page_brief');
    let brief={prompt:'',type:q.get('type')||'landing',experience:'clean',generateAssets:false,attachments:[]};try{if(stored)brief={...brief,...JSON.parse(stored)}}catch{}
    let projectId=q.get('id')||'',lastHtml='';
    const $=id=>document.getElementById(id);
    function hex(v,fallback){return /^#[0-9a-f]{6}$/i.test(String(v||''))?v:fallback}
    function styleName(spec){const t=spec.theme||{},m=spec.motion||{};if(t.experience==='3d'||m.three_d)return 'Immersive 3D';if(t.experience==='cinematic')return 'Cinematic editorial';if(t.experience==='animated')return 'Modern motion';return t.font_style==='editorial'?'Modern editorial':'Modern minimalist'}
    function setDesign(spec,project){const theme=spec.theme||{},hero=spec.hero||{},meta=spec.meta||{};const colors=[hex(theme.surface,'#062125'),hex(theme.accent,'#DFFF4E'),hex(theme.secondary,'#FFE66A'),theme.mode==='light'?'#F4F4EF':'#001012'];$('siteName').textContent=meta.title||project.title||'Your website';$('summary').textContent=hero.subheadline||meta.objective||'A clear direction for your website.';$('palette').innerHTML=colors.map(c=>'<div class="swatch" style="background:'+c+'">'+c.toUpperCase()+'</div>').join('');$('styleTitle').textContent=styleName(spec);$('styleText').textContent='Premium layout, clear hierarchy and a focused next step.';$('brief').textContent=brief.prompt;$('projectMeta').textContent=' · '+(project.status||'draft')}
    async function build(){try{$('status').textContent='Building';let generated;if(projectId){generated={project:{id:projectId}}}else{generated=await Fuse.api('page-generate',{brief});projectId=generated.project.id;const u=new URL(location.href);u.searchParams.set('id',projectId);history.replaceState(null,'',u)}const out=await Fuse.api('page-render',{project_id:projectId});lastHtml=out.html;$('siteFrame').srcdoc=lastHtml;setDesign(out.project.site_spec||generated.spec||{},out.project);$('loading').hidden=true;$('workspace').hidden=false;$('status').textContent='Ready'}catch(e){$('loading').hidden=true;$('error').hidden=false;$('error').textContent=e.message||'Could not build this website. Please try again.';$('status').textContent='Try again'}}
    $('download').onclick=()=>{if(!lastHtml)return;const blob=new Blob([lastHtml],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(($('siteName').textContent||'fuse-website').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''))+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
    window.addEventListener('load',()=>{if(window.Fuse)build();else setTimeout(build,350)});
  </script>
  <script src="fuse-shell.js?v=pages-simple-build-1"></script>
</body>
</html>
