<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join Fuse Atelier</title><meta name="theme-color" content="#001012"><style>body{background:#001012;color:#eeffe0;font:18px Montserrat,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;text-align:center}main{padding:25px}a{color:#dfff4e}</style></head><body><main><p id="message">Opening Fuse Atelier…</p><a href="/signup">Continue to sign up</a></main><script>(async()=>{const code=(new URLSearchParams(location.search).get('ref')||'').toLowerCase();if(!/^[a-z0-9-]{5,80}$/.test(code)){localStorage.removeItem('fuse_pending_referral');location.replace('/signup');return}try{const r=await fetch('/api/fuse-earn?ref='+encodeURIComponent(code));const j=await r.json();if(!r.ok)throw Error(j.error||'This referral link is not available.');localStorage.setItem('fuse_pending_referral',JSON.stringify({code,token:j.token}));location.replace('/signup?ref='+encodeURIComponent(code))}catch(e){document.getElementById('message').textContent=e.message}})();</script></body></html>
