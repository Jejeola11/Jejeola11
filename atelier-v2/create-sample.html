<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02110f">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>Fuse Create — Client Sample</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#02110f;--panel:#071f1a;--line:rgba(111,177,156,.25);--lime:#BAFF63;--yellow:#FFE568;--muted:#8ca39a;--grad:linear-gradient(105deg,#FFE568,#BAFF63 78%,#fff 145%)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#f7fff9}.bridge{position:fixed;z-index:20;top:0;left:0;right:0;height:76px;padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:center;background:rgba(2,17,15,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(186,255,99,.13)}.back,.attach,.tool{border-radius:12px;font-weight:900}.back{width:42px;height:42px;border:1px solid var(--line);background:#08251e;color:#fff;font-size:18px}.copy{min-width:0}.copy span{display:block;color:var(--lime);font-size:7px;letter-spacing:.12em;font-weight:900;text-transform:uppercase}.copy b{display:block;margin-top:3px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy small{display:block;color:var(--muted);font-size:7px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{display:flex;align-items:center;gap:5px}.attach{border:0;background:var(--grad);color:#07120f;padding:10px 11px;font-size:8px;white-space:nowrap}.attach:disabled{opacity:.45}.tool{border:1px solid var(--line);background:#08251e;color:#eaf6f1;padding:9px 10px;font-size:8px;white-space:nowrap}#stage{position:fixed;left:0;right:0;bottom:0;top:76px;width:100%;height:calc(100% - 76px);border:0;background:#090909}.hint{position:fixed;z-index:25;left:50%;bottom:18px;transform:translate(-50%,12px);opacity:0;pointer-events:none;background:#112d26;border:1px solid rgba(186,255,99,.2);border-radius:13px;padding:10px 13px;font-size:8px;box-shadow:0 14px 40px rgba(0,0,0,.35);transition:.18s ease;max-width:calc(100vw - 24px);text-align:center}.hint.show{opacity:1;transform:translate(-50%,0)}.hint.bad{border-color:rgba(255,145,145,.25);color:#ffd1d1}.latest{width:34px;height:34px;border-radius:9px;overflow:hidden;border:1px solid rgba(186,255,99,.22);background:#0b2b23;display:none}.latest.show{display:block}.latest img,.latest video{width:100%;height:100%;object-fit:cover}@media(max-width:620px){.bridge{height:82px;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"back copy" "actions actions";padding:7px 10px}.back{grid-area:back;width:36px;height:36px}.copy{grid-area:copy}.actions{grid-area:actions;justify-content:flex-end;margin-top:-2px}.tool{margin-right:auto}.attach{padding:8px 10px}#stage{top:82px;height:calc(100% - 82px)}}
</style>
</head>
<body>
<header class="bridge">
 <button class="back" id="backBtn" type="button">←</button>
 <div class="copy"><span>CLIENT SAMPLE</span><b id="brandName">Loading prospect…</b><small id="contextLine">Create proof before you pitch.</small></div>
 <div class="actions"><button class="tool" id="toolBtn" type="button">Recommended tool</button><div class="latest" id="latestThumb"></div><button class="attach" id="attachBtn" type="button" disabled>Attach latest result</button></div>
</header>
<iframe id="stage" src="/app/studio.html?source=fuse-clients" title="Fuse Create"></iframe>
<div class="hint" id="hint"></div>
<script>
(()=>{
 const SUPABASE_URL='https://rgbweaimkcndjznlazho.supabase.co',SUPABASE_KEY='sb_publishable_S3IEOR8vkWkXEdGtx8fGjw_nH8c4fV3';
 const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),q=new URLSearchParams(location.search),prospectId=q.get('prospect')||'';
 let prospect=null,latest='',toastTimer,observer=null;
 function hint(msg,bad=false){const h=$('hint');h.textContent=msg;h.className='hint show'+(bad?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>h.className='hint',2800)}
 function clientsUrl(){return '/atelier-v2/clients.html'+(prospectId?'?open='+encodeURIComponent(prospectId):'')}
 $('backBtn').onclick=()=>location.href=clientsUrl();
 function recommendedSelector(service){service=String(service||'').toLowerCase();if(service.includes('design')||service.includes('flyer'))return'[data-go="flyer"]';if(service.includes('ugc')||service.includes('video'))return'[data-go^="video:"]';if(service.includes('product')||service.includes('brand creative'))return'[data-go^="image:"]';return''}
 function openRecommended(){try{const d=$('stage').contentDocument,sel=recommendedSelector(prospect?.service),el=sel&&d?.querySelector(sel);if(el){el.click();hint('Opened the recommended Fuse Create tool.');return}hint('Choose the Fuse Create tool that best fits this sample.')}catch(_){hint('Choose a Create tool inside Fuse.',true)}}
 $('toolBtn').onclick=openRecommended;
 function validOutput(raw){try{const u=new URL(raw,location.origin);if(!/^https?:$/.test(u.protocol))return'';if(u.origin===location.origin&&(/^\/app\//.test(u.pathname)||/^\/atelier-v2\//.test(u.pathname)||/^\/atelier-site\//.test(u.pathname)))return'';return u.href}catch(_){return''}}
 function scan(){try{const d=$('stage').contentDocument;if(!d)return;const active=d.querySelector('.view.active')||d.body;const candidates=[...active.querySelectorAll('.result img[src],.result video[src],#result img[src],#result video[src],#vResult img[src],#vResult video[src],#avvResult img[src],#avvResult video[src],#editResult img[src],#editResult video[src],img[src*="supabase"],video[src*="supabase"]')];for(let i=candidates.length-1;i>=0;i--){const src=validOutput(candidates[i].currentSrc||candidates[i].src||candidates[i].getAttribute('src'));if(src&&src!==latest){latest=src;renderLatest(candidates[i].tagName.toLowerCase()==='video');break}}}catch(_){}}
 function renderLatest(video){const t=$('latestThumb');t.innerHTML=video?`<video src="${latest}" muted playsinline></video>`:`<img src="${latest}" alt="latest result">`;t.classList.add('show');$('attachBtn').disabled=false;$('attachBtn').textContent='Attach result';}
 async function loadProspect(){if(!prospectId){$('brandName').textContent='Create a client sample';$('contextLine').textContent='No prospect selected · work in the real Fuse Create studio';return}const{data:{session}}=await sb.auth.getSession();if(!session){location.href='/atelier-v2/clients.html';return}const{data,error}=await sb.from('client_prospects').select('*').eq('id',prospectId).maybeSingle();if(error||!data){$('brandName').textContent='Prospect unavailable';$('contextLine').textContent='Return to Fuse Clients and reopen the prospect.';hint(error?.message||'Could not load this prospect.',true);return}prospect=data;$('brandName').textContent=data.brand_name;$('contextLine').textContent=[data.service,data.visible_problem].filter(Boolean).join(' · ')||'Create proof before you pitch.';setTimeout(openRecommended,1800)}
 async function attach(){if(!latest||!prospectId)return;const btn=$('attachBtn');btn.disabled=true;btn.textContent='Attaching…';try{const patch={sample_url:latest,status:prospect?.status==='new'?'qualified':(prospect?.status||'sample_ready')};if(['qualified','new'].includes(prospect?.status||''))patch.status='sample_ready';const{data,error}=await sb.from('client_prospects').update(patch).eq('id',prospectId).select().single();if(error)throw error;prospect=data;hint('Sample attached. Prospect moved to Sample Ready.');setTimeout(()=>location.href=clientsUrl(),850)}catch(e){hint(e.message||'Could not attach the sample.',true);btn.disabled=false;btn.textContent='Attach result'}}
 $('attachBtn').onclick=attach;
 $('stage').addEventListener('load',()=>{setTimeout(()=>{try{const d=$('stage').contentDocument;if(observer)observer.disconnect();observer=new MutationObserver(scan);observer.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['src','class']});scan()}catch(_){ }},1200)});
 setInterval(scan,1600);loadProspect();
})();
</script>
</body>
</html>
