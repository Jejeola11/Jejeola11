<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02110f">
<title>Fuse Resource Vault</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#02110f;--panel:#071d18;--panel2:#0a2921;--line:#285044;--lime:#baff63;--yellow:#ffe568;--text:#f6fff9;--muted:#91a69e;--grad:linear-gradient(110deg,#ffe568,#baff63)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 85% 0,#1e573e 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:92px}button,input{font:inherit}.hidden{display:none!important}.shell{width:min(820px,calc(100% - 24px));margin:auto}
.top{position:sticky;top:0;z-index:20;background:#02110fed;backdrop-filter:blur(18px);border-bottom:1px solid #baff6318}.topin{height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:19px;font-weight:950;letter-spacing:-.04em}.brand span{color:var(--lime)}.back{border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:12px;padding:9px 12px;font-weight:850}.saved-pill{border:1px solid #baff6347;background:#102a22;color:var(--lime);border-radius:999px;padding:8px 11px;font-size:9px;font-weight:900;white-space:nowrap}
main{padding:18px 0}.hero{position:relative;overflow:hidden;border:1px solid #5c8d7a66;border-radius:27px;padding:23px;background:linear-gradient(145deg,#09251f,#061a16)}.hero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-85px;top:-105px;background:radial-gradient(circle,#baff6345,transparent 67%);pointer-events:none}.eyebrow{font-size:9px;letter-spacing:.17em;text-transform:uppercase;color:var(--lime);font-weight:950}.hero h1{font-size:clamp(38px,8vw,58px);line-height:.92;letter-spacing:-.06em;margin:9px 0 12px;max-width:600px}.hero h1 em{font-style:normal;color:var(--yellow)}.hero p{color:#aec0ba;font-size:12px;line-height:1.55;max-width:580px;margin:0}.stats{display:flex;gap:8px;margin-top:17px;flex-wrap:wrap}.stat{border:1px solid #ffffff1c;background:#ffffff0a;border-radius:999px;padding:7px 10px;font-size:8px;font-weight:850}.stat b{color:var(--lime)}
.search{margin-top:13px;display:flex;gap:8px}.searchbox{position:relative;flex:1}.searchbox span{position:absolute;left:14px;top:12px;color:var(--muted)}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:15px;background:#061a16;color:#fff;padding:0 14px 0 39px;outline:0}.search input:focus{border-color:var(--lime)}.filter{display:flex;gap:7px;overflow:auto;padding:11px 1px 5px;scrollbar-width:none}.filter::-webkit-scrollbar{display:none}.chip{border:1px solid var(--line);background:var(--panel);color:#abc0b8;border-radius:999px;padding:9px 13px;font-size:9px;font-weight:900;white-space:nowrap}.chip.active{background:var(--grad);border-color:transparent;color:#06110e}
.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:23px 2px 10px}.sectionhead h2{font-size:23px;letter-spacing:-.045em;margin:4px 0 0}.sectionhead small{color:var(--muted);font-size:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{position:relative;min-height:210px;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,#09241d,#061713);padding:16px;display:flex;flex-direction:column;overflow:hidden}.card.featured{grid-column:span 2;min-height:225px;background:linear-gradient(135deg,#153526,#08221c)}.card.featured:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;bottom:-90px;background:radial-gradient(circle,#ffe5683d,transparent 68%)}.type{width:43px;height:43px;border-radius:14px;background:var(--grad);color:#07120f;display:grid;place-items:center;font-size:20px;font-weight:950}.meta{display:flex;justify-content:space-between;align-items:start}.badge{border:1px solid #ffffff20;border-radius:999px;padding:5px 7px;color:#bad0c8;font-size:7px;font-weight:900;text-transform:uppercase}.card h3{font-size:18px;letter-spacing:-.04em;line-height:1.05;margin:15px 0 7px}.card p{color:var(--muted);font-size:10px;line-height:1.45;margin:0 0 16px}.actions{display:flex;gap:7px;margin-top:auto;position:relative;z-index:2}.open,.save{border-radius:11px;height:39px;font-weight:950;font-size:9px}.open{border:0;background:var(--grad);color:#07120f;flex:1}.save{width:42px;border:1px solid var(--line);background:#061713;color:#d8e8e1;font-size:16px}.save.on{color:var(--yellow);border-color:#ffe56877;background:#2a2915}.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted);font-size:11px}.auth{min-height:75vh;display:grid;place-items:center}.authcard{width:min(420px,100%);border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:23px}.authcard h1{font-size:32px;letter-spacing:-.05em;margin:8px 0}.authcard p{color:var(--muted);font-size:11px;line-height:1.55}.authcard a{display:block;text-align:center;text-decoration:none;background:var(--grad);color:#07120f;padding:12px;border-radius:12px;font-weight:950;margin-top:15px}
.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;background:#031713f5;border-top:1px solid #baff631a;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:30}.bottom a{color:#87a098;text-decoration:none;text-align:center;font-size:8px;font-weight:850}.bottom a span{display:block;font-size:18px;margin-bottom:3px}.bottom a.active{color:var(--lime)}.bottom .create{width:58px;height:58px;margin:-23px auto 0;border-radius:18px;background:var(--grad);color:#07120f;display:grid;place-items:center;font-size:23px}
@media(max-width:560px){.hero{padding:20px 17px}.hero h1{font-size:42px}.grid{grid-template-columns:1fr}.card,.card.featured{grid-column:auto;min-height:195px}.saved-pill{font-size:8px}.bottom{height:72px}}
</style><link rel="stylesheet" href="/atelier-v2/fuse.css?v=teal-1"><script src="/atelier-v2/fuse-shell.js?v=teal-1" defer></script><script src="/atelier-v2/legacy-bridge.js" defer></script></head>
<body data-page="profile"><div data-fuse-header></div>
<header class="top"><div class="shell topin"><button class="back" onclick="location.href='/atelier-v2/'">←</button><div class="brand">Fuse <span>Resources</span></div><button id="savedPill" class="saved-pill">✦ <span id="creditCount">0</span> credits · ★ <span id="savedCount">0</span></button></div></header>
<main class="shell">
  <section id="auth" class="auth hidden"><div class="authcard"><div class="eyebrow">MEMBERS ONLY</div><h1>Your vault is locked.</h1><p>Sign in from the Fuse Atelier home screen to use the resource library and save your favourites.</p><a href="/atelier-v2/">Go to sign in →</a></div></section>
  <div id="app" class="hidden">
    <section class="hero"><h1>Resources</h1><span id="totalCount" hidden></span></section>
    <div class="search"><label class="searchbox"><span>⌕</span><input id="search" type="search" placeholder="Search prompts, clients, video…" autocomplete="off"></label></div>
    <div id="filters" class="filter"></div>
    <div class="sectionhead"><div><div class="eyebrow" id="sectionLabel">EXPLORE</div><h2 id="sectionTitle">All resources</h2></div><small id="resultCount"></small></div>
    <section id="grid" class="grid"></section>
  </div>
</main>
<nav class="bottom"><a href="/atelier-v2/"><span>⌂</span>Home</a><a href="/atelier-v2/academy-v2.html"><span>◇</span>Academy</a><a class="create" href="/atelier-v2/create.html">✦</a><a href="/atelier-v2/clients.html"><span>◎</span>Clients</a><a class="active" href="/atelier-v2/resources.html"><span>▤</span>Resources</a></nav>
<script>
(()=>{
const URL='https://rgbweaimkcndjznlazho.supabase.co',KEY='sb_publishable_S3IEOR8vkWkXEdGtx8fGjw_nH8c4fV3';
const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),$=id=>document.getElementById(id);
let session=null,items=[],saved=new Set(),purchases=new Set(),credits=0,category='All',savedOnly=false;
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const icons={PDF:'▤',Guide:'↗',Tool:'✦',Template:'▦',Video:'▶'};
function categories(){return ['All',...new Set(items.map(x=>x.category).filter(Boolean))]}
function drawFilters(){$('filters').innerHTML=categories().map(c=>`<button class="chip ${c===category&&!savedOnly?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')+`<button class="chip ${savedOnly?'active':''}" data-saved="1">★ Saved</button>`;$('filters').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;savedOnly=false;drawFilters();render()});$('filters').querySelector('[data-saved]').onclick=()=>{savedOnly=!savedOnly;drawFilters();render()}}
function filtered(){const q=$('search').value.trim().toLowerCase();return items.filter(x=>(category==='All'||x.category===category)&&(!savedOnly||saved.has(x.id))&&(!q||`${x.title} ${x.description} ${x.category} ${x.resource_type}`.toLowerCase().includes(q)))}
function render(){let list=filtered();$('sectionLabel').textContent=savedOnly?'YOUR COLLECTION':category==='All'?'EXPLORE':category.toUpperCase();$('sectionTitle').textContent=savedOnly?'Saved for later':category==='All'?'All resources':category;$('resultCount').textContent=`${list.length} ${list.length===1?'resource':'resources'}`;$('savedCount').textContent=saved.size;$('creditCount').textContent=credits;$('grid').innerHTML=list.length?list.sort((a,b)=>Number(b.featured)-Number(a.featured)).map(x=>{const unlocked=x.access_type==='free'||purchases.has(x.id);const label=unlocked?'Open resource →':`Unlock for ${x.credit_cost} credits`;return `<article class="card ${x.featured?'featured':''}"><div class="meta"><div class="type">${icons[x.resource_type]||'✦'}</div><span class="badge">${esc(x.resource_type)} · ${unlocked?'Included':x.credit_cost+' credits'}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><div class="actions"><button class="open" data-resource="${x.id}">${label}</button><button class="save ${saved.has(x.id)?'on':''}" data-save="${x.id}" aria-label="Save resource">${saved.has(x.id)?'★':'☆'}</button></div></article>`}).join(''):'<div class="empty">No resources match this view yet. Try another category or search.</div>';$('grid').querySelectorAll('[data-resource]').forEach(b=>b.onclick=()=>openOrUnlock(b.dataset.resource));$('grid').querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>toggleSave(b.dataset.save))}
async function toggleSave(id){if(saved.has(id)){const{error}=await sb.from('resource_saves').delete().eq('user_id',session.user.id).eq('resource_id',id);if(error)return alert(error.message);saved.delete(id)}else{const{error}=await sb.from('resource_saves').insert({user_id:session.user.id,resource_id:id});if(error)return alert(error.message);saved.add(id)}render()}
async function openOrUnlock(id){const item=items.find(x=>x.id===id);if(!item)return;if(item.access_type==='free'||purchases.has(id)){location.href=item.url;return}if(credits<item.credit_cost){alert(`You need ${item.credit_cost-credits} more credits to unlock ${item.title}.`);return}if(!confirm(`Unlock “${item.title}” for ${item.credit_cost} credits? This cannot be reversed.`))return;const button=document.querySelector('[data-resource="'+id+'"]');if(button){button.disabled=true;button.textContent='Unlocking…'}const{data,error}=await sb.rpc('purchase_resource',{p_resource_id:id});if(button)button.disabled=false;if(error){alert(error.message||'Could not unlock this resource.');render();return}const receipt=Array.isArray(data)?data[0]:data;if(receipt?.status==='unlocked'||receipt?.status==='already_unlocked'){purchases.add(id);credits=Number(receipt.credits_remaining||0);render();if(receipt.status==='unlocked')alert('Unlocked ✓ Your credits have been updated.');location.href=item.url;return}alert('Could not unlock this resource.')}
async function boot(){const{data}=await sb.auth.getSession();session=data.session;if(!session){$('auth').classList.remove('hidden');return}$('app').classList.remove('hidden');const[{data:resources,error},{data:saves},{data:owned},{data:profile}]=await Promise.all([sb.from('resource_items').select('*').eq('active',true).order('created_at'),sb.from('resource_saves').select('resource_id').eq('user_id',session.user.id),sb.from('resource_purchases').select('resource_id').eq('user_id',session.user.id),sb.from('profiles').select('credits').eq('id',session.user.id).maybeSingle()]);if(error){$('grid').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}items=resources||[];saved=new Set((saves||[]).map(x=>x.resource_id));purchases=new Set((owned||[]).map(x=>x.resource_id));credits=Number(profile?.credits||0);$('totalCount').textContent=items.length;drawFilters();render();$('search').oninput=render;$('savedPill').onclick=()=>{savedOnly=true;category='All';drawFilters();render();$('grid').scrollIntoView({behavior:'smooth'})}}
boot();
})();
</script></body></html>
