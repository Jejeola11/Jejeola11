<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02110f"><title>Fuse Atelier — Premium Mobile Home V7</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02110f;color:#f8fff9;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}#stage{position:fixed;inset:0;border:0;width:100%;height:100%;opacity:0;transition:opacity .18s ease;background:#02110f}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#02110f;z-index:2}.loader>div{text-align:center}.mark{width:48px;height:48px;border-radius:15px;margin:0 auto 12px;background:linear-gradient(135deg,#ffe568,#baff63 70%,#fff);display:grid;place-items:center;color:#06110e;font-size:24px;font-weight:950}.loader b{font-size:14px}.loader p{margin:5px 0 0;color:#789087;font-size:10px}.ready #stage{opacity:1}.ready .loader{display:none}</style></head><body><div class="loader"><div><div class="mark">✦</div><b>Loading Fuse Atelier</b><p>Preparing your creative feed.</p></div></div><iframe id="stage" src="./home-v6.html?v=20260901-2357" title="Fuse Atelier"></iframe><script>(()=>{const stage=document.getElementById('stage');const getText=async p=>(await fetch(p+'?v=7',{cache:'no-store'})).text();const mediaPromise=Promise.all([getText('./media/ugc.b64.1'),getText('./media/ugc.b64.2'),getText('./media/twin.b64.1'),getText('./media/twin.b64.2')]).then(([u1,u2,t1,t2])=>{const toUrl=s=>{const raw=atob(s.replace(/\s/g,'')),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return URL.createObjectURL(new Blob([bytes],{type:'video/mp4'}))};return{left:toUrl(u1+u2),right:toUrl(t1+t2)}});let tries=0,done=false;async function patch(){if(done)return;tries++;let outer,inner,d;try{outer=stage.contentDocument;inner=outer&&outer.getElementById('app');d=inner&&inner.contentDocument}catch(e){}if(!d||!d.querySelectorAll('.hero-card video').length){if(tries<80)return setTimeout(patch,100);document.body.classList.add('ready');return}try{const media=await mediaPromise;const vids=[...d.querySelectorAll('.hero-card video')];const apply=(v,src)=>{if(!v)return;v.pause();v.removeAttribute('poster');v.src=src;v.muted=true;v.defaultMuted=true;v.autoplay=true;v.loop=true;v.playsInline=true;v.setAttribute('muted','');v.setAttribute('autoplay','');v.setAttribute('loop','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.load();const p=v.play();if(p&&p.catch)p.catch(()=>setTimeout(()=>v.play().catch(()=>{}),250))};apply(vids[0],media.left);apply(vids[2],media.right);const labels=[['Creator UGC','Skincare ad'],['Product Story','Campaign film'],['Fuse Twin','Avatar content']];d.querySelectorAll('.hero-label').forEach((el,i)=>{if(labels[i])el.innerHTML=labels[i][0]+'<small>'+labels[i][1]+'</small>'});d.documentElement.dataset.exactHeroMedia='1';done=true;document.body.classList.add('ready');setTimeout(()=>{apply(vids[0],media.left);apply(vids[2],media.right)},350)}catch(e){console.error('Fuse hero media error',e);if(tries<80)return setTimeout(patch,150);document.body.classList.add('ready')}}stage.addEventListener('load',()=>setTimeout(patch,120));setTimeout(patch,500);setTimeout(patch,1200)})()</script></body></html>
