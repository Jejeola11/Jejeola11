<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#021416"><title>Create · Fuse Atelier</title><link rel="stylesheet" href="fuse.css?v=teal-1"><style>
:root{--create-lime:#e2ff4e;--create-soft:#d9ffca;--create-muted:#a8c0bd;--create-line:#315354}body.create-catalog{background:radial-gradient(circle at 100% 0,#1a5552 0,transparent 35%),linear-gradient(115deg,#001313,#002827 70%,#174e4c);min-height:100svh;padding-bottom:20px}.create-catalog .fuse-nav{display:none}.create-wrap{width:100%;max-width:760px;margin:0 auto;padding:47px 32px 40px}.create-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:54px}.create-title{margin:0;color:var(--create-lime);font-size:56px;line-height:1;font-weight:850;letter-spacing:-.08em}.create-close{width:84px;height:84px;border:0;border-radius:50%;background:linear-gradient(135deg,#eaff4e,#d4ffbe);color:#06201d;font-size:51px;font-weight:300;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 13px 35px #baff6340}.create-close span{transform:translateY(-3px)}.create-tabs{display:flex;gap:18px;overflow-x:auto;margin:0 -32px 73px;padding:0 0 2px;scrollbar-width:none}.create-tabs::-webkit-scrollbar{display:none}.create-tab{flex:0 0 auto;height:80px;padding:0 40px;border:2px solid var(--create-line);border-radius:45px;background:rgba(0,16,17,.32);color:var(--create-muted);font-size:29px;font-weight:750;cursor:pointer}.create-tab.active{background:linear-gradient(110deg,#ebff52,#d5ffc8);border-color:transparent;color:#061b19;box-shadow:0 14px 32px #baff6340}.create-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:27px;row-gap:37px}.create-card{display:block;min-width:0;color:inherit;text-decoration:none;cursor:pointer}.create-media{aspect-ratio:3/4;border:4px solid #d7ff4d;border-radius:42px;overflow:hidden;background:#031313;box-shadow:0 0 0 1px #f8ffd0 inset}.create-media img{display:block;width:100%;height:100%;object-fit:cover}.create-card h2{font-size:28px;line-height:1.05;letter-spacing:-.045em;color:var(--create-lime);margin:21px 6px 0;font-weight:800}.model-grid .model-card{min-height:330px;border:2px solid #6b9b33;border-radius:30px;background:linear-gradient(145deg,#001a1a,#062d2b);padding:31px 32px 26px;display:flex;flex-direction:column;color:#eefbdc}.model-card .model-meta{display:flex;justify-content:space-between;align-items:center;gap:8px}.model-badge{display:inline-flex;align-items:center;min-height:42px;padding:0 18px;border-radius:24px;background:linear-gradient(110deg,#efff51,#dfffd1);color:#061713;font-size:18px;font-weight:850;text-transform:uppercase}.model-credits{font-size:22px;font-weight:800;white-space:nowrap}.model-card h2{margin:auto 0 16px;color:var(--create-lime);font-size:32px;line-height:1.08;letter-spacing:-.05em}.model-card p{margin:0;color:var(--create-muted);font-size:23px;line-height:1.45}.model-grid .model-card.featured{min-height:470px}.empty-state{grid-column:1/-1;color:var(--create-muted);font-size:18px;padding:30px 4px}@media(max-width:560px){.create-title{font-size:56px}.create-tab{height:80px;padding:0 38px;font-size:28px}.create-grid{column-gap:25px;row-gap:34px}.create-media{border-radius:39px}.create-card h2{font-size:27px}.model-grid .model-card{min-height:310px;padding:31px 32px 25px}.model-grid .model-card.featured{min-height:470px}.model-card h2{font-size:31px}.model-card p{font-size:22px}}@media(max-width:390px){.create-wrap{padding-left:20px;padding-right:20px}.create-tabs{margin-left:-20px;margin-right:-20px}.create-tab{padding:0 29px;font-size:24px}.create-media{border-radius:30px}.create-card h2{font-size:23px}.model-grid .model-card{padding:24px 23px}.model-card h2{font-size:26px}.model-card p{font-size:18px}}
</style></head><body class="create-catalog" data-page="create"><main class="create-wrap"><header class="create-top"><h1 class="create-title">Create</h1><button class="create-close" id="closeCreate" aria-label="Close Create"><span>×</span></button></header><nav class="create-tabs" id="createTabs" aria-label="Create categories"></nav><section class="create-grid" id="createGrid"></section></main><script>
const media='/atelier-site/assets/work/';const tabs=['All','Image','Video','Twin','Page','Voice','Flyer','Content','Lipsync','UGC'];const tools=[{cat:'Image',title:'Create Image',img:'still-03.jpg',href:'studio.html?type=image'},{cat:'Video',title:'Create Video',img:'work-20-poster.jpg',href:'studio.html?type=video'},{cat:'Page',title:'Build Landing Page',img:'ai-campaign-flyer.jpg',href:'../pitchpilot/site-builder.html'},{cat:'Twin',title:'Create Your AI Twin',img:'still-01.jpg',href:'studio.html?type=image'},{cat:'Voice',title:'Clone Your Voice',voice:true,href:'studio.html?type=audio'},{cat:'Flyer',title:'AI Flyer',img:'ai-campaign-flyer.jpg',href:'studio.html?type=image'},{cat:'Lipsync',title:'Lipsync Video',img:'work-11-poster.jpg',href:'studio.html?type=video'},{cat:'UGC',title:'UGC Video',img:'work-10-poster.jpg',href:'studio.html?type=video'},{cat:'Content',title:'Instagram Content',img:'work-03-poster.jpg',href:'studio.html?type=image'}];const models=[['BEST QUALITY','2 credits','GPT Image 2.5 Sunburst','Precision, detail and premium campaign images.'],['FAST','2 credits','GPT Image 2.5 Flare','Fast, polished everyday image generation.'],['PHOTOREAL','2 credits','MiniMax H3 Image','Cinema-grade portraits and realistic stills.'],['MARKETING','3 credits','Seedream 5 Pro','Strong composition, typography and product visuals.'],['CONSISTENT','4 credits','Nano Banana 2','Characters, edits and reliable reference consistency.'],['4K PRO','5 credits','Nano Banana Pro','High-resolution professional images and precise edits.'],['CREATIVE','2 credits','Flux 2 Pro','Stylized campaigns with sharp prompt control.'],['TYPOGRAPHY','3 credits','Qwen Image 3 Pro','Clean text, posters and commercial compositions.']];let selected=new URLSearchParams(location.search).get('category')||'All';function renderTabs(){document.getElementById('createTabs').innerHTML=tabs.map(t=>`<button class="create-tab ${selected===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{selected=b.dataset.tab;render()})}function render(){renderTabs();const grid=document.getElementById('createGrid');if(selected==='Image'){grid.className='create-grid model-grid';grid.innerHTML=models.map((m,i)=>`<article class="model-card ${i===0?'featured':''}"><div class="model-meta"><span class="model-badge">${m[0]}</span><span class="model-credits">${m[1]}</span></div><h2>${m[2]}</h2><p>${m[3]}</p></article>`).join('');return}grid.className='create-grid';const list=selected==='All'?tools:tools.filter(t=>t.cat===selected);grid.innerHTML=list.length?list.map(t=>`<a class="create-card" href="${t.href}"><div class="create-media">${t.voice?'<div style="height:100%;display:grid;place-items:center;background:radial-gradient(circle,#214d32,#001616)"><span style="font-size:86px;color:#ddff89">▮▮▮</span></div>':`<img src="${media+t.img}" alt="${t.title}" loading="lazy">`}</div><h2>${t.title}</h2></a>`).join(''):'<p class="empty-state">More Create tools are coming soon.</p>'}document.getElementById('closeCreate').onclick=()=>location.href='home.html';render();
</script></body></html>
