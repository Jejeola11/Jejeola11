<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#001012">
  <title>Create · Fuse Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fuse.css?v=footer-unified-7">
  <style>
    :root{
      --deep:#001012;--mid:#00191B;--light:#1B4C52;--surface:#062125;--line:#315456;
      --yellow:#FFE66A;--lime:#DFFF4E;--white:#EEFFE0;--muted:#b7cbca;
      --chrome:linear-gradient(105deg,#FFE66A 0%,#DFFF4E 52%,#EEFFE0 100%);
    }
    *{box-sizing:border-box}
    html{background:var(--deep)}
    body.create-catalog{
      margin:0;min-height:100svh;overflow-x:hidden;color:#fff;font-family:Montserrat,Arial,sans-serif;
      padding:0 0 calc(94px + env(safe-area-inset-bottom));
      background:radial-gradient(circle at 94% 6%,rgba(27,76,82,.42),transparent 30%),linear-gradient(112deg,var(--deep) 0%,var(--mid) 62%,var(--light) 100%);
    }
    button{font:inherit}
    .create-wrap{width:min(920px,calc(100% - 32px));margin:0 auto;padding:16px 0 24px}
    .create-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
    .create-title{margin:0;font-size:28px;line-height:1;font-weight:500;letter-spacing:-1.1px;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    .create-close{width:38px;height:38px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;background:var(--chrome);color:#001012;cursor:pointer;box-shadow:0 8px 20px rgba(223,255,78,.13)}
    .create-close span{font-size:27px;line-height:.8;font-weight:300;transform:translateY(-1px)}

    .create-tabs{display:flex;gap:9px;overflow-x:auto;margin:0 calc(50% - 50vw) 26px;padding:0 max(16px,calc((100vw - 920px)/2)) 2px;scrollbar-width:none;scroll-snap-type:x proximity}
    .create-tabs::-webkit-scrollbar{display:none}
    .create-tab{flex:0 0 auto;min-width:84px;height:40px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;background:rgba(0,16,18,.3);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;scroll-snap-align:start}
    .create-tab.active{background:var(--chrome);border-color:transparent;color:#001012;box-shadow:0 8px 20px rgba(223,255,78,.11)}

    .create-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 22px;align-items:start}
    .create-card{min-width:0;display:block;text-decoration:none;color:inherit}
    .create-media{width:100%;aspect-ratio:3/4;overflow:hidden;border:2px solid transparent;border-radius:22px;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--chrome) border-box}
    .create-media img,.create-media video{width:100%;height:100%;display:block;object-fit:cover;background:var(--surface)}
    .create-card h2{margin:10px 4px 0;font-size:15px;line-height:1.18;letter-spacing:-.4px;font-weight:500;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}

    .voice-card{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,rgba(223,255,78,.16),transparent 32%),linear-gradient(145deg,#00191B,#123c39)}
    .voice-bars{display:flex;align-items:center;gap:9px;height:100px}
    .voice-bars i{width:10px;border-radius:999px;background:linear-gradient(180deg,#FFE66A,#DFFF4E,#EEFFE0);opacity:.82;transform-origin:center;animation:voicePulse 1.05s ease-in-out infinite;box-shadow:0 0 18px rgba(223,255,78,.10)}
    .voice-bars i:nth-child(1){height:36px;animation-delay:0s}.voice-bars i:nth-child(2){height:62px;animation-delay:.12s}.voice-bars i:nth-child(3){height:90px;animation-delay:.24s}.voice-bars i:nth-child(4){height:66px;animation-delay:.36s}.voice-bars i:nth-child(5){height:42px;animation-delay:.48s}
    @keyframes voicePulse{0%,100%{transform:scaleY(.45);opacity:.55}50%{transform:scaleY(1.05);opacity:1}}

    .model-grid{gap:16px 14px}
    .model-grid .create-media{aspect-ratio:4/3;border-radius:18px}
    .model-grid .create-card h2{font-size:14px;margin-top:8px}
    .model-card{aspect-ratio:4/3;min-height:0;border:1.5px solid rgba(223,255,78,.48);border-radius:18px;background:linear-gradient(145deg,rgba(0,25,27,.98),rgba(6,33,37,.98));padding:13px;display:flex;flex-direction:column;color:#fff;overflow:hidden}
    .model-meta{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .model-badge{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;background:var(--chrome);color:#001012;font-size:9px;line-height:1;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
    .model-credits{color:#fff;font-size:11px;line-height:1.15;font-weight:500;white-space:nowrap}
    .model-card h2{margin:auto 0 5px;font-size:15px;line-height:1.08;letter-spacing:-.45px;font-weight:500;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    .model-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.32;font-weight:300;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

    .empty-state{grid-column:1/-1;margin:0;padding:24px 4px;color:var(--muted);font-size:16px;font-weight:300}

    @media(min-width:760px){
      .create-wrap{padding-top:22px}
      .create-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px}
      .model-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
      .model-card h2{font-size:16px}.model-card p{font-size:12px}.model-badge{font-size:10px}.model-credits{font-size:12px}
    }
    @media(max-width:390px){
      .create-wrap{width:calc(100% - 24px);padding-top:14px}.create-close{width:36px;height:36px}.create-close span{font-size:25px}
      .create-tabs{padding-left:12px;padding-right:12px}.create-tab{min-width:80px;padding:0 14px;font-size:13px}
      .create-grid{gap:22px 18px}.create-card h2{font-size:14px}.model-grid{gap:14px 12px}.model-card{padding:11px;border-radius:16px}.model-card h2{font-size:13px}.model-card p{font-size:10px}.model-badge{font-size:8px;min-height:22px;padding:0 7px}.model-credits{font-size:10px}
    }
  </style>
</head>
<body class="create-catalog" data-page="create">
  <main class="create-wrap">
    <header class="create-top">
      <h1 class="create-title">Create</h1>
      <button class="create-close" id="closeCreate" aria-label="Close Create"><span>×</span></button>
    </header>
    <nav class="create-tabs" id="createTabs" aria-label="Create categories"></nav>
    <section class="create-grid" id="createGrid"></section>
  </main>

  <script>
    const tabs=['All','Image','Video','Twin','Page','Voice','Flyer','Content','Lipsync','UGC'];
    const tools=[
      {cat:'Image',title:'Create Image',img:'https://res.cloudinary.com/bzw55wh2/image/upload/v1788626963/4870020.png',href:'studio.html?type=image'},
      {cat:'Video',title:'Create Video',video:'/atelier-site/assets/course-ai-ugc.mp4',href:'studio.html?type=video'},
      {cat:'Page',title:'Build Landing Page',img:'/atelier-site/assets/work/landing-card.jpg',fallback:'https://res.cloudinary.com/bzw55wh2/image/upload/v1789492222/fuse-atelier/academy/landing-card.webp',href:'../pitchpilot/site-builder.html'},
      {cat:'Twin',title:'Create Your AI Twin',img:'/atelier-site/assets/work/still-01.jpg',href:'studio.html?type=image'},
      {cat:'Voice',title:'Clone Your Voice',voice:true,href:'studio.html?type=audio'},
      {cat:'Flyer',title:'AI Flyer',img:'/atelier-site/assets/work/ai-campaign-flyer.jpg',href:'studio.html?type=image'},
      {cat:'Lipsync',title:'Lipsync Video',video:'/atelier-site/assets/work/work-11.mp4',href:'studio.html?type=video'},
      {cat:'UGC',title:'UGC Video',video:'/atelier-site/assets/work/work-10.mp4',href:'studio.html?type=video'},
      {cat:'Content',title:'Instagram Content',video:'/atelier-site/assets/work/work-03.mp4',href:'studio.html?type=image'}
    ];
    const models=[
      ['BEST QUALITY','2 credits','GPT Image 2.5 Sunburst','Precision, detail and premium campaign images.'],
      ['FAST','2 credits','GPT Image 2.5 Flare','Fast, polished everyday image generation.'],
      ['PHOTOREAL','2 credits','MiniMax H3 Image','Cinema-grade portraits and realistic stills.'],
      ['MARKETING','3 credits','Seedream 5 Pro','Strong composition, typography and product visuals.'],
      ['CONSISTENT','4 credits','Nano Banana 2','Characters, edits and reliable reference consistency.'],
      ['4K PRO','5 credits','Nano Banana Pro','High-resolution professional images and precise edits.'],
      ['CREATIVE','2 credits','Flux 2 Pro','Stylized campaigns with sharp prompt control.'],
      ['TYPOGRAPHY','3 credits','Qwen Image 3 Pro','Clean text, posters and commercial compositions.']
    ];
    let selected=new URLSearchParams(location.search).get('category')||'All';

    function renderTabs(){
      document.getElementById('createTabs').innerHTML=tabs.map(t=>`<button class="create-tab ${selected===t?'active':''}" data-tab="${t}">${t}</button>`).join('');
      document.querySelectorAll('[data-tab]').forEach(btn=>{
        btn.onclick=()=>{
          selected=btn.dataset.tab;
          const url=new URL(location.href);
          if(selected==='All')url.searchParams.delete('category');else url.searchParams.set('category',selected);
          history.replaceState(null,'',url);
          render();
          requestAnimationFrame(()=>btn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}));
        };
      });
    }
    function mediaMarkup(tool){
      if(tool.voice)return '<div class="voice-card" aria-hidden="true"><div class="voice-bars"><i></i><i></i><i></i><i></i><i></i></div></div>';
      if(tool.video)return `<video src="${tool.video}" aria-label="${tool.title}" autoplay muted loop playsinline preload="auto"></video>`;
      const fallback=tool.fallback?` onerror="this.onerror=null;this.src='${tool.fallback}'"`:'';
      return `<img src="${tool.img}" alt="${tool.title}" loading="eager" decoding="async"${fallback}>`;
    }
    function toolMarkup(tool){
      return `<a class="create-card" href="${tool.href}"><div class="create-media">${mediaMarkup(tool)}</div><h2>${tool.title}</h2></a>`;
    }
    function modelMarkup(m){
      return `<article class="model-card"><div class="model-meta"><span class="model-badge">${m[0]}</span><span class="model-credits">${m[1]}</span></div><h2>${m[2]}</h2><p>${m[3]}</p></article>`;
    }
    function render(){
      renderTabs();
      const grid=document.getElementById('createGrid');
      if(selected==='Image'){
        grid.className='create-grid model-grid';
        const imageTool=tools.find(t=>t.cat==='Image');
        grid.innerHTML=toolMarkup(imageTool)+models.map(modelMarkup).join('');
        return;
      }
      grid.className='create-grid';
      const list=selected==='All'?tools:tools.filter(t=>t.cat===selected);
      grid.innerHTML=list.length?list.map(toolMarkup).join(''):'<p class="empty-state">More Create tools are coming soon.</p>';
    }
    document.getElementById('closeCreate').onclick=()=>location.href='home.html';
    render();
  </script>
  <script src="fuse-shell.js?v=footer-unified-7"></script>
</body>
</html>
