<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#001012">
  <title>Create · Fuse Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fuse.css?v=create-models-premium-1">
  <style>
    :root{
      --deep:#001012;--mid:#00191B;--light:#1B4C52;--surface:#062125;--line:#315456;
      --yellow:#FFE66A;--lime:#DFFF4E;--white:#EEFFE0;--muted:#b7cbca;
      --chrome:linear-gradient(105deg,#FFE66A 0%,#DFFF4E 52%,#EEFFE0 100%);
    }
    *{box-sizing:border-box}
    html{background:var(--deep)}
    body.create-catalog{
      margin:0;min-height:100svh;overflow-x:hidden;color:#fff;font-family:Montserrat,Arial,sans-serif;
      padding:0 0 calc(96px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 94% 6%,rgba(27,76,82,.42),transparent 30%),
        linear-gradient(112deg,var(--deep) 0%,var(--mid) 62%,var(--light) 100%);
    }
    button,a{font:inherit}
    .create-wrap{width:min(920px,calc(100% - 32px));margin:0 auto;padding:16px 0 30px}
    .create-top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:17px}
    .create-title{margin:0;font-size:28px;line-height:1;font-weight:500;letter-spacing:-1.05px;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    .create-close{width:38px;height:38px;flex:none;border:0;border-radius:50%;display:grid;place-items:center;background:var(--chrome);color:#001012;cursor:pointer;box-shadow:0 8px 20px rgba(223,255,78,.13)}
    .create-close span{font-size:26px;line-height:.8;font-weight:300;transform:translateY(-1px)}

    .create-tabs{display:flex;gap:9px;overflow-x:auto;margin:0 calc(50% - 50vw) 18px;padding:0 max(16px,calc((100vw - 920px)/2)) 2px;scrollbar-width:none;scroll-snap-type:x proximity}
    .create-tabs::-webkit-scrollbar{display:none}
    .create-tab{flex:0 0 auto;min-width:80px;height:40px;padding:0 15px;border:1.5px solid var(--line);border-radius:999px;background:rgba(0,16,18,.34);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;scroll-snap-align:start}
    .create-tab.active{background:var(--chrome);border-color:transparent;color:#001012;box-shadow:0 8px 20px rgba(223,255,78,.11)}

    .catalog-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 2px 17px}
    .catalog-intro h2{margin:0;font-size:17px;line-height:1.15;font-weight:500;color:#fff}
    .catalog-intro p{margin:6px 0 0;color:var(--muted);font-size:16px;line-height:1.35;font-weight:300;max-width:620px}
    .catalog-count{flex:none;color:var(--muted);font-size:12px;font-weight:400}

    .create-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 22px;align-items:start}
    .create-card{min-width:0;display:block;text-decoration:none;color:inherit;position:relative}
    .create-media{width:100%;aspect-ratio:3/4;overflow:hidden;border:2px solid transparent;border-radius:22px;background:linear-gradient(var(--surface),var(--surface)) padding-box,var(--chrome) border-box}
    .create-media img,.create-media video{width:100%;height:100%;display:block;object-fit:cover;background:var(--surface)}
    .create-card h2{margin:10px 4px 0;font-size:15px;line-height:1.18;letter-spacing:-.3px;font-weight:500;background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
    .pin-badge{position:absolute;top:10px;left:10px;z-index:3;display:inline-flex;align-items:center;height:25px;padding:0 9px;border-radius:999px;background:rgba(0,16,18,.82);border:1px solid rgba(238,255,224,.20);backdrop-filter:blur(10px);font-size:9px;font-weight:600;letter-spacing:.06em;color:#fff}

    .voice-card{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 46%,rgba(223,255,78,.16),transparent 32%),linear-gradient(145deg,#00191B,#123c39)}
    .voice-bars{display:flex;align-items:center;gap:9px;height:100px}
    .voice-bars i{width:10px;border-radius:999px;background:linear-gradient(180deg,#FFE66A,#DFFF4E,#EEFFE0);opacity:.82;transform-origin:center;animation:voicePulse 1.05s ease-in-out infinite;box-shadow:0 0 18px rgba(223,255,78,.10)}
    .voice-bars i:nth-child(1){height:36px;animation-delay:0s}.voice-bars i:nth-child(2){height:62px;animation-delay:.12s}.voice-bars i:nth-child(3){height:90px;animation-delay:.24s}.voice-bars i:nth-child(4){height:66px;animation-delay:.36s}.voice-bars i:nth-child(5){height:42px;animation-delay:.48s}
    @keyframes voicePulse{0%,100%{transform:scaleY(.45);opacity:.55}50%{transform:scaleY(1.05);opacity:1}}

    .model-grid{gap:15px 13px}
    .model-grid .create-media{aspect-ratio:4/3;border-radius:18px}
    .model-grid .create-card h2{font-size:14px;margin-top:8px}
    .model-card{
      aspect-ratio:4/3;min-height:0;border:1.5px solid rgba(223,255,78,.40);border-radius:18px;overflow:hidden;
      position:relative;background:#062125;color:#fff;isolation:isolate;box-shadow:0 15px 36px rgba(0,0,0,.16);
    }
    .model-card::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,16,18,.02) 18%,rgba(0,16,18,.26) 51%,rgba(0,16,18,.95) 100%);z-index:2;pointer-events:none}
    .model-card::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,255,255,.05);border-radius:inherit;z-index:5;pointer-events:none}
    .model-visual{position:absolute;inset:0;z-index:0;overflow:hidden;background:#082426}
    .model-visual img,.model-visual video{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.01)}
    .model-visual video{background:#082426}
    .model-card:hover .model-visual img,.model-card:hover .model-visual video{transform:scale(1.035)}
    .model-visual img,.model-visual video{transition:transform .45s ease}
    .model-shine{position:absolute;inset:-35%;z-index:1;background:linear-gradient(115deg,transparent 35%,rgba(238,255,224,.08) 48%,transparent 58%);transform:translateX(-28%) rotate(5deg);animation:shine 7s ease-in-out infinite;pointer-events:none}
    @keyframes shine{0%,70%,100%{transform:translateX(-35%) rotate(5deg)}85%{transform:translateX(35%) rotate(5deg)}}
    .model-meta{position:absolute;z-index:3;top:10px;left:10px;right:10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .model-badge{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;background:var(--chrome);color:#001012;font-size:9px;line-height:1;font-weight:600;text-transform:uppercase;letter-spacing:.03em;box-shadow:0 7px 18px rgba(0,0,0,.18)}
    .model-credits{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:999px;background:rgba(0,16,18,.72);border:1px solid rgba(238,255,224,.14);backdrop-filter:blur(8px);color:#fff;font-size:10px;line-height:1;font-weight:500;white-space:nowrap}
    .model-copy{position:absolute;z-index:3;left:11px;right:11px;bottom:10px}
    .model-copy h2{margin:0 0 4px;font-size:14px;line-height:1.06;letter-spacing:-.34px;font-weight:500;color:#fff}
    .model-copy p{margin:0;color:#c4d4d2;font-size:10px;line-height:1.28;font-weight:300;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .page-card{aspect-ratio:4/3;min-height:0}
    .page-card .model-copy{display:none}
    .page-card .model-visual{background:#082426}
    .page-card .visual-word{width:100%;padding:0 12px;text-align:center;font-size:clamp(25px,6vw,39px);line-height:1;letter-spacing:-1.2px}
    .page-card .visual-word small{display:none}
    .page-card .model-meta{align-items:center}
    .page-card .model-badge,.page-card .model-credits{font-size:9px}
    .model-card[data-route]{cursor:pointer;text-decoration:none}
    .model-card[data-route]:active{transform:scale(.985)}
    .model-card{transition:transform .2s ease,border-color .2s ease}
    .model-card:hover{border-color:rgba(223,255,78,.72)}

    .visual-sunburst{background:radial-gradient(circle at 65% 18%,rgba(255,230,106,.62),transparent 18%),radial-gradient(circle at 28% 72%,rgba(223,255,78,.46),transparent 24%),linear-gradient(135deg,#25150a,#0b3935 58%,#001012)}
    .visual-flare{background:radial-gradient(circle at 24% 28%,rgba(255,230,106,.74),transparent 17%),radial-gradient(circle at 72% 65%,rgba(27,76,82,.9),transparent 26%),linear-gradient(135deg,#153b38,#001012)}
    .visual-minimax{background:radial-gradient(ellipse at 52% 38%,rgba(238,255,224,.28),transparent 18%),radial-gradient(circle at 25% 75%,rgba(255,230,106,.25),transparent 21%),linear-gradient(135deg,#111d1e,#17484b)}
    .visual-seedream{background:radial-gradient(circle at 20% 20%,rgba(255,230,106,.55),transparent 18%),radial-gradient(circle at 77% 72%,rgba(134,85,255,.30),transparent 25%),linear-gradient(145deg,#173c39,#071d1d)}
    .visual-nano{background:radial-gradient(circle at 70% 28%,rgba(223,255,78,.52),transparent 20%),radial-gradient(circle at 25% 70%,rgba(74,190,204,.28),transparent 24%),linear-gradient(145deg,#061a1c,#173a35)}
    .visual-nanopro{background:radial-gradient(circle at 25% 28%,rgba(238,255,224,.36),transparent 20%),linear-gradient(125deg,#43320b,#162928 48%,#061012)}
    .visual-flux{background:conic-gradient(from 230deg at 70% 45%,#001012,#1b4c52,#dfff4e,#ffe66a,#001012)}
    .visual-qwen{background:radial-gradient(circle at 35% 30%,rgba(255,230,106,.35),transparent 20%),linear-gradient(140deg,#20174a,#0b4549 60%,#001012)}
    .visual-grok{background:linear-gradient(145deg,#070707,#213c3b 72%,#7f9b39)}
    .visual-kling{background:radial-gradient(circle at 70% 28%,rgba(255,230,106,.52),transparent 18%),linear-gradient(145deg,#08191c,#174353)}
    .visual-wan{background:radial-gradient(circle at 35% 26%,rgba(111,203,255,.32),transparent 22%),linear-gradient(140deg,#001012,#0f3942 50%,#332f0e)}
    .visual-seedance{background:radial-gradient(circle at 23% 22%,rgba(255,102,147,.26),transparent 22%),radial-gradient(circle at 75% 68%,rgba(223,255,78,.25),transparent 25%),linear-gradient(145deg,#102525,#1b2949)}
    .visual-veo{background:radial-gradient(circle at 70% 24%,rgba(89,170,255,.34),transparent 22%),linear-gradient(150deg,#081c2c,#0b3d35 55%,#091211)}
    .visual-omni{background:radial-gradient(circle at 48% 44%,rgba(238,255,224,.48),transparent 15%),conic-gradient(from 210deg,#001012,#315456,#dfff4e,#ffe66a,#1b4c52,#001012)}
    .visual-voice{background:radial-gradient(circle at 50% 50%,rgba(223,255,78,.18),transparent 30%),linear-gradient(145deg,#00191B,#123c39)}
    .visual-twin{background:radial-gradient(circle at 50% 30%,rgba(238,255,224,.23),transparent 18%),linear-gradient(145deg,#072124,#173936)}
    .visual-content{background:radial-gradient(circle at 28% 28%,rgba(255,230,106,.30),transparent 18%),radial-gradient(circle at 78% 68%,rgba(223,255,78,.22),transparent 20%),linear-gradient(145deg,#071b1d,#173d40)}

    .visual-word{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-size:clamp(21px,5vw,34px);font-weight:500;letter-spacing:-1px;color:rgba(255,255,255,.94);text-shadow:0 10px 28px rgba(0,0,0,.28)}
    .visual-word small{display:block;font-size:9px;font-weight:500;letter-spacing:.15em;text-align:center;margin-top:4px;color:#dfff4e;text-transform:uppercase}
    .visual-bars{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px;z-index:1}
    .visual-bars i{width:7px;border-radius:999px;background:var(--chrome);animation:voicePulse 1.15s ease-in-out infinite}
    .visual-bars i:nth-child(1){height:28px}.visual-bars i:nth-child(2){height:48px;animation-delay:.1s}.visual-bars i:nth-child(3){height:72px;animation-delay:.2s}.visual-bars i:nth-child(4){height:54px;animation-delay:.3s}.visual-bars i:nth-child(5){height:33px;animation-delay:.4s}

    .empty-state{grid-column:1/-1;margin:0;padding:24px 4px;color:var(--muted);font-size:16px;font-weight:300}

    @media(min-width:760px){
      .create-wrap{padding-top:22px}
      .create-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px}
      .model-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
      .model-copy h2{font-size:15px}.model-copy p{font-size:11px}.model-badge{font-size:10px}.model-credits{font-size:11px}
    }
    @media(max-width:520px){
      .catalog-intro{align-items:flex-start}.catalog-count{display:none}
      .catalog-intro p{font-size:15px}
    }
    @media(max-width:390px){
      .create-wrap{width:calc(100% - 24px);padding-top:14px}.create-close{width:36px;height:36px}.create-close span{font-size:25px}
      .create-tabs{padding-left:12px;padding-right:12px}.create-tab{min-width:78px;padding:0 13px;font-size:13px}
      .create-grid{gap:22px 18px}.create-card h2{font-size:14px}.model-grid{gap:13px 11px}
      .model-copy{left:9px;right:9px;bottom:8px}.model-copy h2{font-size:12px}.model-copy p{font-size:9px}.model-meta{top:8px;left:8px;right:8px}.model-badge{font-size:8px;min-height:21px;padding:0 6px}.model-credits{font-size:9px;min-height:21px;padding:0 6px}
    }

    .create-agent{min-height:510px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:42px 0 30px}
    .create-agent-brand{display:flex;align-items:center;gap:13px;margin-bottom:28px;color:#fff;font-size:clamp(28px,6vw,42px);font-weight:600;letter-spacing:-1.5px}
    .create-agent-brand img{width:54px;height:54px;object-fit:contain}
    .create-composer{width:min(100%,780px);padding:18px;border-radius:30px;border:1px solid rgba(238,255,224,.20);background:linear-gradient(145deg,#132426,#0a1c1e);box-shadow:0 20px 52px rgba(0,0,0,.28)}
    .create-composer textarea{width:100%;min-height:84px;resize:vertical;max-height:240px;background:transparent;border:0;outline:0;color:#fff;font:400 19px/1.45 Montserrat,Arial,sans-serif}
    .create-composer textarea::placeholder{color:#a6b6b5}
    .composer-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
    .composer-pill,.composer-plus{border:1px solid rgba(238,255,224,.15);background:#193033;color:#fff;min-height:43px;padding:0 14px;border-radius:999px;cursor:pointer}
    .composer-plus{width:43px;padding:0;font-size:27px;line-height:1}
    .composer-send{margin-left:auto;width:48px;height:48px;border:0;border-radius:50%;background:var(--chrome);color:#001012;font-size:29px;line-height:1;cursor:pointer}
    .composer-send:disabled{opacity:.55;cursor:wait}.composer-message{width:min(100%,780px);min-height:20px;margin:9px 0;color:var(--white);font-size:12px}
    .composer-files{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}.composer-file{font-size:11px;border:1px solid var(--line);background:#062125;color:#fff;border-radius:12px;padding:6px 9px;display:flex;gap:7px;align-items:center;max-width:100%}.composer-file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}.composer-file button{border:0;background:none;color:var(--lime);cursor:pointer}
    .create-agent~.create-tabs{margin-top:4px}.create-agent~.catalog-intro{margin-top:4px}
    .create-sheet{position:fixed;inset:auto 0 0;width:min(100%,720px);max-height:min(86svh,850px);margin:0 auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:28px 28px 0 0;background:#091718;color:#fff;box-shadow:0 -24px 80px #0009;overflow-y:auto;z-index:110}
    .create-sheet::backdrop{background:#000a}.sheet-head{display:flex;align-items:center;justify-content:space-between}.sheet-head h2{margin:0;font-size:21px}.sheet-head button{width:38px;height:38px;border:0;border-radius:50%;background:#263638;color:#fff;font-size:23px}
    .sheet-search{width:100%;height:47px;background:#172729;border:1px solid var(--line);border-radius:14px;padding:0 14px;color:#fff;margin:16px 0}
    .sheet-group{font-size:13px;color:var(--white);margin:18px 4px 9px}.sheet-option{width:100%;min-height:70px;padding:10px 12px;display:flex;align-items:center;gap:13px;border:1px solid transparent;border-radius:16px;background:transparent;color:#fff;text-align:left;cursor:pointer}.sheet-option:hover,.sheet-option[aria-selected="true"]{background:#192b2d;border-color:#476368}.sheet-symbol{flex:none;display:grid;place-items:center;width:46px;height:46px;border:1px solid #315456;border-radius:14px;background:#102527;color:var(--lime);font-size:20px}.sheet-option strong{display:block;font-size:14px}.sheet-option small{display:block;color:#a8bcba;margin-top:4px;font-size:11px;line-height:1.3}.sheet-check{margin-left:auto;color:var(--lime);font-size:21px}
    .sheet-upload{display:block;width:100%;margin:17px 0;padding:20px;border:1px dashed var(--line);border-radius:16px;background:#102527;text-align:center;color:#fff;cursor:pointer}.sheet-upload input{display:none}.sheet-assets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sheet-assets button{border:1px solid var(--line);border-radius:13px;background:#132528;color:#fff;padding:9px;overflow:hidden;min-height:100px}.sheet-assets img,.sheet-assets video{width:100%;height:105px;object-fit:cover;border-radius:9px}.sheet-assets span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}.sheet-done{width:100%;min-height:46px;margin-top:14px;border:0;border-radius:13px;background:var(--chrome);font-weight:700;color:#001012}
    @media(max-width:520px){.create-agent{min-height:410px;padding:28px 0 20px}.create-agent-brand{font-size:29px;margin-bottom:23px}.create-agent-brand img{width:45px;height:45px}.create-composer{padding:14px;border-radius:23px}.create-composer textarea{font-size:15px;min-height:75px}.composer-pill{font-size:12px;padding:0 10px}.composer-toolbar{gap:5px}.composer-plus{width:40px;min-height:40px}.composer-send{width:43px;height:43px}.create-sheet{max-height:85svh}}

    .create-wrap{padding-top:0}
    .create-agent{min-height:0;padding:18px 0 16px;justify-content:flex-start}
    .create-agent-brand{font-size:clamp(23px,4.8vw,30px);gap:8px;margin:0 0 18px;letter-spacing:-.7px}
    .create-agent-brand img{width:37px;height:37px}
    .create-composer{padding:12px 14px 10px;border-radius:24px;width:min(100%,780px)}
    .create-composer textarea{min-height:132px;max-height:300px;font-size:17px}
    .composer-toolbar{margin-top:0}.composer-pill,.composer-plus{min-height:39px}.composer-plus{width:39px}.composer-send{height:43px;width:43px}
    .composer-message{margin:7px 0 0;min-height:0}
    .create-grid{margin-top:8px}
    @media(max-width:520px){.create-agent{padding:11px 0 11px}.create-agent-brand{font-size:24px;margin-bottom:14px}.create-agent-brand img{width:34px;height:34px}.create-composer{padding:10px 12px 9px;border-radius:22px}.create-composer textarea{min-height:125px;font-size:15px}.composer-pill{font-size:12px;padding:0 10px}.create-grid{gap:18px 14px;margin-top:10px}}
  </style>
</head>
<body class="create-catalog" data-page="create">
  <link rel="stylesheet" href="create-composer.css?v=chat-settings-3">
  <main class="create-wrap">
    <section class="create-agent" aria-label="Start creating">
      <div class="create-agent-brand"><img src="https://res.cloudinary.com/bzw55wh2/image/upload/v1793361152/fuse-atelier/create/fuse-mark-transparent-20261030.png" alt="">Fuse Atelier</div>
      <div id="generationChat" class="generation-chat" aria-label="Your creations"></div>
      <div class="create-composer"><div class="composer-files" id="composerFiles"></div><textarea id="createPrompt" maxlength="4000" aria-label="Describe what you want to create" placeholder="Create a cinematic trailer for my brand"></textarea>
        <div class="composer-toolbar"><button type="button" class="composer-plus" id="assetOpen" aria-label="Add reference assets">+</button><button type="button" class="composer-pill" id="modelOpen"><span aria-hidden="true">▣</span><span id="modelLabel">Loading models…</span></button><button type="button" class="composer-settings" id="settingsOpen" aria-label="Model settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3v18M12 3v18M18 3v18M3 8h6M9 16h6M15 6h6"/></svg></button><button type="button" class="composer-send" id="createSend" aria-label="Generate with quoted credits" disabled>✦ …</button></div>
      </div><p class="composer-message" id="composerMessage" role="status" aria-live="polite"></p>
    </section>
    <section class="create-grid" id="createGrid"></section>
  </main>

  <dialog class="create-sheet" id="modelSheet" aria-label="Choose a model"><div class="sheet-head"><h2>Model</h2><button type="button" data-close-sheet aria-label="Close model picker">×</button></div><input class="sheet-search" id="modelSearch" type="search" placeholder="Search models" aria-label="Search models"><div id="modelOptions"></div></dialog>
  <dialog class="create-sheet" id="settingsSheet" aria-label="Model settings"><div class="sheet-head"><h2>Settings</h2><button type="button" data-close-sheet aria-label="Close settings">×</button></div><div id="modelSettings"></div><p class="settings-cost" id="settingsCost">Choose a model</p><button type="button" class="sheet-done" id="settingsDone">Apply settings</button></dialog>
  <dialog class="ratio-sheet" id="settingChoices" aria-label="Choose setting"><div class="sheet-head"><h2 id="choiceTitle"></h2><button type="button" id="choiceClose" aria-label="Close options">×</button></div><div id="choiceOptions"></div></dialog>
  <dialog class="create-sheet" id="assetSheet" aria-label="Assets"><div class="sheet-head"><h2>Assets</h2><button type="button" data-close-sheet aria-label="Close assets">×</button></div><p class="sheet-selection-count" id="assetCount">0 of 14 selected</p><nav class="asset-tabs" aria-label="Asset categories"><button type="button" data-asset-tab="uploads" aria-selected="true">Uploads</button><button type="button" data-asset-tab="characters">AI Characters</button><button type="button" data-asset-tab="presets">Presets</button><button type="button" data-asset-tab="elements">Elements</button></nav><input id="assetInput" type="file" accept="image/*,video/*,audio/*" multiple hidden><div class="sheet-assets" id="assetList"></div><p class="asset-help" id="assetHelp"></p><button type="button" class="sheet-done" id="assetsDone" disabled>Apply</button></dialog>
  <script>
    const tabs=['All','Image','Video','Twin','Page','Voice','Flyer','Content','Lipsync','UGC'];

    const tools=[
      {cat:'Image',title:'Create Image',img:'https://res.cloudinary.com/bzw55wh2/image/upload/v1788626963/4870020.png',href:'image-create.html'},
      {cat:'Video',title:'Create Video',video:'/atelier-site/assets/course-ai-ugc.mp4',href:'video-create.html'},
      {cat:'Page',title:'Build Website With AI',img:'/atelier-site/assets/work/landing-card.jpg',fallback:'https://res.cloudinary.com/bzw55wh2/image/upload/v1789492222/fuse-atelier/academy/landing-card.webp',href:'page-create.html'},
      {cat:'Twin',title:'Create Your AI Twin',img:'https://res.cloudinary.com/bzw55wh2/image/upload/v1789528511/fuse-atelier/create/ai-twin-car.jpg',route:'avatar'},
      {cat:'Voice',title:'Clone Your Voice',voice:true,route:'audio'},
      {cat:'Flyer',title:'AI Flyer',img:'https://res.cloudinary.com/bzw55wh2/image/upload/v1789527907/fuse-atelier/create/ai-flyer-rosen.jpg',route:'flyer'},
      {cat:'Lipsync',title:'Lipsync Video',video:'https://res.cloudinary.com/bzw55wh2/video/upload/v1789529143/fuse-atelier/create/lipsync-video.mp4',route:'omni'},
      {cat:'UGC',title:'UGC Video',video:'https://res.cloudinary.com/bzw55wh2/video/upload/v1789528540/fuse-atelier/create/ugc-video.mp4',route:'video-seedance'}
      // Social content remains available in the Content tab, outside the All shortcuts.
    ];

    const catalogs={
      Image:{
        title:'Image models',
        text:'Fast everyday generations, premium campaign visuals and consistent characters.',
        items:[
          {name:'GPT Image 2.5 Sunburst',badge:'BEST QUALITY',credits:'2 credits',desc:'Precision, detail and premium campaign images.',visual:'sunburst',word:'2.5',route:'imagepage:sunburst'},
          {name:'GPT Image 2.5 Flare',badge:'FAST',credits:'2 credits',desc:'Fast, polished everyday image generation.',visual:'flare',word:'FLARE',route:'imagepage:flare'},
          {name:'MiniMax H3 Image',badge:'PHOTOREAL',credits:'1 credit',desc:'Natural portraits and realistic commercial stills.',visual:'minimax',word:'H3',route:'imagepage:minimax-h3'},
          {name:'Seedream 5 Pro',badge:'MARKETING',credits:'3 credits',desc:'Strong composition, products and campaign graphics.',visual:'seedream',word:'5 PRO',route:'imagepage:seedream-5-pro'},
          {name:'Nano Banana 2',badge:'CONSISTENT',credits:'4 credits',desc:'Reliable characters, references and creative edits.',visual:'nano',word:'NB 2',route:'imagepage:nano-banana-2'},
          {name:'Nano Banana Pro',badge:'4K PRO',credits:'8 credits',desc:'High-resolution professional imagery and precise edits.',visual:'nanopro',word:'4K',route:'imagepage:nano-banana-pro'},
          {name:'Flux 2 Pro',badge:'CREATIVE',credits:'2 credits',desc:'Stylized campaigns with sharp prompt control.',visual:'flux',word:'FLUX',route:'imagepage:flux-2-pro'},
          {name:'Qwen Image 3 Pro',badge:'TYPOGRAPHY',credits:'3 credits',desc:'Clean text, posters and commercial compositions.',visual:'qwen',word:'QWEN',route:'imagepage:qwen-image-3-pro'}
        ]
      },
      Video:{
        title:'Video models',
        text:'From fast social clips to cinematic generation and intelligent video editing.',
        items:[
          {name:'MiniMax H3',badge:'NATIVE AUDIO',credits:'from 4 credits',desc:'Cinematic clips with flexible quality and native stereo audio.',visual:'minimax',video:'/app/media/samples/vid1.mp4',route:'videopage:minimax-h3'},
          {name:'Wan 3.0',badge:'BEST VALUE',credits:'from 5 credits',desc:'Flexible 2–30s generation with strong image guidance and native audio.',visual:'wan',video:'/app/media/samples/vid2.mp4',route:'videopage:wan-3'},
          {name:'Grok Imagine',badge:'FAST',credits:'1 credit',desc:'Creative, punchy videos built for fast social ideas.',visual:'grok',video:'/app/media/samples/vid2.mp4',route:'videopage:grok-imagine'},
          {name:'Kling 3.0 Standard',badge:'CINEMATIC',credits:'9 credits',desc:'High-control movement and polished cinematic output.',visual:'kling',video:'/app/media/samples/vid4.mp4',route:'videopage:kling-standard'},
          {name:'Seedance 2.5',badge:'6 REFS',credits:'dynamic',desc:'Reference-guided cinematic video with images, video, audio and custom duration.',visual:'seedance',video:'/app/media/samples/vid3.mp4',route:'videopage:seedance-2.5'},
          {name:'Veo 3.1 Fast',badge:'PREMIUM',credits:'22 credits',desc:'High-end visual storytelling with strong prompt fidelity.',visual:'veo',video:'/app/media/samples/vid5.mp4',route:'videopage:veo-fast'},
          {name:'Gemini Omni Flash 1.1',badge:'OMNI',credits:'from 3 credits',desc:'Fast synchronized-audio generation from text or image, up to 4K.',visual:'omni',video:'/app/media/samples/vid3.mp4',route:'videopage:omni-flash'}
        ]
      },
      Voice:{
        title:'Voice models',
        text:'Clone a voice, create natural voiceovers and choose quality by project.',
        items:[
          {name:'Qwen3 TTS',badge:'EVERYDAY',credits:'1 credit',desc:'Fast, affordable voice generation for short content.',visual:'voice',bars:true,route:'audio'},
          {name:'MiniMax Speech 2.6 Turbo',badge:'NATURAL',credits:'3 credits',desc:'Natural voiceovers with expressive everyday delivery.',visual:'voice',bars:true,route:'audio'},
          {name:'MiniMax Speech 2.6 HD',badge:'PREMIUM',credits:'5 credits',desc:'Higher-fidelity voice for ads, courses and brand work.',visual:'voice',bars:true,route:'audio'},
          {name:'MiniMax Voice Clone',badge:'VOICE CLONE',credits:'24 credits',desc:'Create a reusable custom voice identity from a sample.',visual:'voice',bars:true,route:'audio'}
        ]
      },
      Twin:{
        title:'Twin & character models',
        text:'Build consistent identities, talking twins and reusable character workflows.',
        items:[
          {name:'Instant Character',badge:'CONSISTENT',credits:'5 credits',desc:'Keep one identity consistent across outfits, poses and scenes.',visual:'twin',img:'https://res.cloudinary.com/bzw55wh2/image/upload/v1789528511/fuse-atelier/create/ai-twin-car.jpg',route:'avatar'},
          {name:'Quick Face Swap',badge:'FAST',credits:'1 credit',desc:'Swap a face cleanly for fast creator and concept work.',visual:'twin',word:'SWAP',route:'omni'},
          {name:'Face Swap Pro',badge:'PRO',credits:'2 credits',desc:'More controlled face replacement for polished outputs.',visual:'twin',word:'PRO',route:'omni'},
          {name:'Video Face Swap',badge:'VIDEO',credits:'dynamic',desc:'Carry your selected identity into existing video footage.',visual:'twin',video:'/app/media/samples/vid4.mp4',route:'omni'},
          {name:'InfiniteTalk',badge:'TALKING TWIN',credits:'dynamic',desc:'Turn one image and audio into a speaking digital human.',visual:'twin',video:'/app/media/samples/vid1.mp4',route:'avatar'},
          {name:'Wan 3 Reference',badge:'SCENE',credits:'dynamic',desc:'Create character-consistent video scenes from references.',visual:'wan',video:'/app/media/samples/vid2.mp4',route:'avatar'}
        ]
      },
      Page:{
        title:'Fuse Pages',
        text:'Build conversion-focused landing pages, business websites, portfolios and immersive 3D experiences with AI.',
        items:[
          {name:'Landing',badge:'CONVERSION',credits:'NEW',desc:'',visual:'content',word:'LANDING',route:'page:landing',kind:'page'},
          {name:'Sales',badge:'SELL',credits:'NEW',desc:'',visual:'sunburst',word:'SALES',route:'page:sales',kind:'page'},
          {name:'Business',badge:'BUSINESS',credits:'NEW',desc:'',visual:'minimax',word:'BUSINESS',route:'page:business',kind:'page'},
          {name:'Portfolio',badge:'SHOWCASE',credits:'NEW',desc:'',visual:'seedream',word:'PORTFOLIO',route:'page:portfolio',kind:'page'},
          {name:'3D',badge:'IMMERSIVE',credits:'NEW',desc:'',visual:'omni',word:'3D',route:'page:3d',kind:'page'}
        ]
      },
      Content:{
        title:'Content tools',
        text:'Turn ideas into hooks, scripts, carousels and repeatable social content.',
        items:[
          {name:'Hooks & Captions',badge:'FAST',credits:'1 credit',desc:'Scroll-stopping hooks and captions for daily posting.',visual:'content',word:'HOOKS',route:'studio:generate'},
          {name:'UGC Script',badge:'SELL',credits:'1 credit',desc:'Short natural scripts built around an offer or product.',visual:'content',word:'UGC',route:'studio:generate'},
          {name:'Carousel Copy',badge:'SOCIAL',credits:'1 credit',desc:'Structured slides with a clear hook, flow and CTA.',visual:'content',word:'CAROUSEL',route:'studio:generate'},
          {name:'30-Day Content Plan',badge:'PLAN',credits:'2 credits',desc:'A practical month of ideas organized around your goal.',visual:'content',word:'30 DAYS',route:'studio:generate'},
          {name:'Deep Strategy',badge:'PRO',credits:'3 credits',desc:'Longer positioning and content strategy for campaigns.',visual:'content',word:'STRATEGY',route:'studio:generate'}
        ]
      }
    };

    const descriptions={
      All:['Create with Fuse','Choose what you want to make, then open the exact workspace.'],
      Page:['Build landing pages','Turn an offer into a polished, conversion-focused page.'],
      Flyer:['AI flyer studio','Build polished campaign flyers, posters and social ads.'],
      Lipsync:['Lipsync video','Sync dialogue or voice to a face and keep it natural.'],
      UGC:['UGC video','Create creator-style ads and product videos for brands.']
    };

    let selected=new URLSearchParams(location.search).get('category')||'All';

    function workspace(route){
      const map={
        avatar:'studio.html?category=Twin',
        audio:'studio.html?category=Voice',
        flyer:'studio.html?category=Flyer',
        omni:'studio.html?category=Lipsync',
        'video-seedance':'video-create.html?model=seedance-2.5',
        'studio:generate':'studio.html?category=Content'
      };
      return map[route]||'studio.html';
    }

    function renderTabs(){
      const root=document.getElementById('createTabs');
      root.innerHTML=tabs.map(t=>`<button class="create-tab ${selected===t?'active':''}" data-tab="${t}">${t}</button>`).join('');
      root.querySelectorAll('[data-tab]').forEach(btn=>{
        btn.onclick=()=>{
          selected=btn.dataset.tab;
          const url=new URL(location.href);
          if(selected==='All')url.searchParams.delete('category');else url.searchParams.set('category',selected);
          history.replaceState(null,'',url);
          render();
          requestAnimationFrame(()=>btn.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}));
        };
      });
    }

    function mediaMarkup(tool){
      if(tool.voice)return '<div class="voice-card" aria-hidden="true"><div class="voice-bars"><i></i><i></i><i></i><i></i><i></i></div></div>';
      if(tool.video)return `<video src="${tool.video}" aria-label="${tool.title}" autoplay muted loop playsinline preload="metadata"></video>`;
      const fallback=tool.fallback?` onerror="this.onerror=null;this.src='${tool.fallback}'"`:'';
      return `<img src="${tool.img}" alt="${tool.title}" loading="eager" decoding="async"${fallback}>`;
    }

    function toolMarkup(tool,pinned=false){
      const href=tool.href||workspace(tool.route||'studio:generate');
      return `<a class="create-card" href="${href}">${pinned?'<span class="pin-badge">FUSE TOOL</span>':''}<div class="create-media">${mediaMarkup(tool)}</div><h2>${tool.title}</h2></a>`;
    }

    function modelVisual(m){
      if(m.img)return `<div class="model-visual visual-${m.visual||'content'}"><img src="${m.img}" alt="" loading="eager" decoding="async"></div>`;
      if(m.video)return `<div class="model-visual visual-${m.visual||'content'}"><video src="${m.video}" muted autoplay loop playsinline preload="metadata" aria-hidden="true"></video></div>`;
      if(m.bars)return '<div class="model-visual visual-voice"><div class="visual-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>';
      return `<div class="model-visual visual-${m.visual||'content'}"><div class="visual-word">${m.word||m.name.split(' ')[0]}<small>Fuse Atelier</small></div></div>`;
    }

    function modelMarkup(m){
      const pageClass=m.kind==='page'?' page-card':'';
      const attrs=m.route?` data-route="${m.route}" role="link" tabindex="0"`:'';
      return `<article class="model-card${pageClass}"${attrs}>
        ${modelVisual(m)}
        <span class="model-shine" aria-hidden="true"></span>
        <div class="model-meta"><span class="model-badge">${m.badge}</span><span class="model-credits">${m.credits}</span></div>
        <div class="model-copy"><h2>${m.name}</h2><p>${m.desc}</p></div>
      </article>`;
    }

    function wireModelRoutes(){
      document.querySelectorAll('.model-card[data-route]').forEach(card=>{
        const open=()=>{const r=card.dataset.route||'';location.href=r.startsWith('imagepage:')?'image-create.html?model='+encodeURIComponent(r.slice(10)):r.startsWith('videopage:')?'video-create.html?model='+encodeURIComponent(r.slice(10)):r.startsWith('page:')?'page-create.html?type='+encodeURIComponent(r.slice(5)):workspace(r);};
        card.onclick=open;
        card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
      });
    }

    function setIntro(title,text,count){
      const intro=document.getElementById('catalogIntro');
      if(selected==='Page'){intro.hidden=true;return}
      intro.hidden=false;
      document.getElementById('catalogTitle').textContent=title;
      document.getElementById('catalogText').textContent=text;
      document.getElementById('catalogCount').textContent=count?count+' tools':'';
    }

    function render(){
      const grid=document.getElementById('createGrid');
      grid.className='create-grid';
      grid.replaceChildren();
      tools.forEach(tool=>{
        const card=document.createElement('article');
        card.className='create-card';
        card.innerHTML='<div class="create-media">'+mediaMarkup(tool)+'</div><h2></h2>';
        card.querySelector('h2').textContent=tool.title;
        grid.append(card);
      });
    }

    render();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="fuse-shell.js?v=footer-unified-7"></script>
  <script src="create-composer.js?v=chat-settings-3" defer></script>
</body>
