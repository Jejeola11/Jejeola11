<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020907"><title>Create · Fuse Atelier</title><link rel="stylesheet" href="fuse.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script><script src="fuse-shell.js" defer></script><script src="studio.js" defer></script></head><body data-page="create"><div data-fuse-header></div><main class="fuse-wrap"><div class="fuse-heading"><h1>Create something great.</h1></div><div class="tabs" id="types" aria-label="Output type"><button class="btn" data-type="image">Image</button><button class="btn" data-type="video">Video</button><button class="btn" data-type="audio">Voice</button><a class="btn" href="design.html">Design & flyers</a></div><div class="studio-grid"><form class="panel" id="generateForm"><label class="field"><span>Model</span><select id="model" required disabled><option>Loading models…</option></select></label><label class="field"><span id="promptLabel">Prompt</span><textarea id="prompt" maxlength="5000" placeholder="Describe what you want to create…" required></textarea></label><div class="row" id="visualSettings"><label class="field"><span>Shape</span><select id="aspect"></select></label><label class="field" id="durationField" hidden><span>Length</span><select id="duration"></select></label></div><div id="voiceSettings" hidden><label class="field"><span>Voice recording (HTTPS audio link)</span><input id="voiceUrl" type="url" placeholder="https://…/my-voice.mp3"></label><label class="field"><span>Recording transcript (optional)</span><textarea id="referenceText" maxlength="5000" placeholder="What you said in the recording"></textarea></label><label><input id="consent" type="checkbox"> I own this voice or have permission to use it.</label><p class="muted">Use a clear 15–30 second recording. Voice generation uses paid credits.</p></div><button class="btn primary wide" id="generate" disabled>Loading settings…</button><p id="studioStatus" class="status" role="status"></p></form><section><div class="fuse-heading" style="margin-top:0"><h2>Your creations</h2><button class="btn" id="refreshResults">Refresh</button></div><div id="results" class="results"><div class="panel muted">Your results will appear here.</div></div></section></div></main></body></html>
