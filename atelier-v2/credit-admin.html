<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify credit payment · Fuse Atelier</title><style>body{margin:0;background:linear-gradient(145deg,#000b0d,#073d43);color:#e9f7f7;font:16px/1.6 system-ui;min-height:100vh}main{max-width:640px;padding:32px 20px;margin:auto}h1{line-height:1.2}input,select,button,a.button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0 18px;border:1px solid #688a8d;border-radius:8px;font:inherit}input,select{background:#032025;color:#fff}button,a.button{background:linear-gradient(110deg,#91a9ac,#efffff,#a1babe);color:#00191c;font-weight:700;text-decoration:none;display:block;text-align:center}label{display:block}input[type=checkbox]{width:auto}small,p{color:#bad1d3}button:disabled{opacity:.5}a{color:#d6edef}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script><script src="fuse-shell.js" defer></script><script src="credit-admin.js" defer></script></head><body><main><h1>Verify a credit payment</h1><p>Owner access only. Check the successful transaction in your Nestuge dashboard before adding credits. Use the transaction reference from Nestuge, not a screenshot filename.</p><form id="verify"><label>Customer’s Fuse email<input name="email" type="email" required autocomplete="off"></label><label>Pack<select name="pack" id="pack" required></select></label><label>Amount paid (NGN)<input name="amount_naira" type="number" min="1" required></label><label>Nestuge transaction reference<input name="reference" minlength="3" maxlength="200" required autocomplete="off"></label><label><input type="checkbox" name="verified" required> I checked this payment in Nestuge and confirmed the customer and amount.</label><button id="save">Verify payment and add credits</button></form><p role="status" id="status"></p><a href="/atelier-v2/home.html">Back to Fuse</a></main></body></html>
