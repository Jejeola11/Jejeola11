</style></head><body><main class="page"><img class="brand-mark" src="media/fuse-mark-gradient.png" alt="Fuse Atelier mark"><h1 class="brand">Fuse Atelier</h1><p class="tagline">Learn, Create and Sell</p><h2 class="login-title">Access Fuse Atelier</h2><p class="intro">Enter your name and email address to get in</p><div class="notice"><span class="notice-icon">⚠</span><div><strong>Important:</strong> Use the same email address you used when completing your purchase.<br>If you enter a different email, access will be denied.</div></div><form id="accessForm"><div class="field"><label for="name">Your Name</label><div class="input-wrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 6 0 0 1 16 0v3"/></svg><input id="name" name="name" autocomplete="name" placeholder="Your name" required></div></div><div class="field"><label for="email">Email Address</label><div class="input-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" name="email" type="email" autocomplete="email" placeholder="your@email.com" required></div></div><button class="submit" id="submit" type="submit">Get access</button><p class="message" id="message" role="status"></p></form><p class="footer">Don't have access yet? <a href="/atelier">Get the Blueprint</a> <span class="arrow">→</span></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script>
