<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00191b">
  <title>Access Fuse Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--deep:#00191b;--field:#062125;--line:#315456;--chrome:linear-gradient(105deg,#ffe66a 0%,#dfff4e 48%,#eeffe0 100%);--lime:#dfff4e;--copy:#f5f8f6;--muted:#bad0cd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--deep);color:var(--copy);font-family:Roboto,Arial,sans-serif}body{min-height:100svh;display:flex;justify-content:center}.access{width:min(720px,100%);min-height:100svh;padding:18px 42px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}.mark{width:118px;height:118px;object-fit:contain;margin:0 0 12px;display:block;background:transparent}h1,.title{background:var(--chrome);background-clip:text;-webkit-background-clip:text;color:transparent}h1{font-size:36px;line-height:1;font-weight:800;letter-spacing:-2.2px;margin:0}.tagline{font-size:24px;line-height:1.18;margin:21px 0 0}.title{font-size:35px;line-height:1.1;letter-spacing:-1.9px;font-weight:800;margin:70px 0 24px}.lead{font-size:21px;line-height:1.2;white-space:nowrap;margin:0 0 43px}.notice{width:100%;border:2px solid #9d8a2a;border-radius:30px;background:#18271d;color:#ffe75c;padding:24px 28px;display:flex;gap:20px;text-align:left;align-items:flex-start;font-size:20px;line-height:1.92;margin-bottom:42px}.notice-icon{font-size:35px;line-height:1;margin-top:4px}.notice strong{font-weight:800}.form{width:100%}.field{width:100%;text-align:left;margin-bottom:32px}.field label{display:block;color:#ebfa48;font-size:23px;margin:0 0 16px}.input-wrap{height:84px;border:2px solid var(--line);border-radius:19px;background:var(--field);display:flex;align-items:center;gap:22px;padding:0 30px}.input-wrap svg{width:30px;height:30px;stroke:#b9cecb;stroke-width:2;fill:none;flex:none}.input-wrap input{width:100%;border:0;outline:0;background:transparent;color:#f8fffb;font-size:24px;font-weight:500;min-width:0}.input-wrap input::placeholder{color:#b5c8c5;opacity:1}.submit{width:100%;height:84px;border:0;border-radius:19px;background:var(--chrome);color:#071411;font-size:24px;font-weight:800;box-shadow:0 15px 0 #29491b;cursor:pointer;margin-top:7px}.submit:disabled{opacity:.65}.message{min-height:24px;margin:22px 0 0;font-size:15px;line-height:1.4;color:#ffb9a9}.message.ok{color:#dfff77}.foot{margin-top:auto;padding-top:76px;font-size:21px;line-height:1.35;white-space:nowrap}.foot a{color:var(--lime);font-weight:800;text-decoration:none}.arrow{font-size:25px}@media(max-width:390px){.access{padding-left:24px;padding-right:24px}.mark{width:94px;height:94px}h1{font-size:30px}.tagline{font-size:20px}.title{font-size:29px;margin-top:52px}.lead{font-size:17px}.notice{font-size:17px;padding:20px 20px;gap:14px;line-height:1.72}.notice-icon{font-size:29px}.field label{font-size:20px}.input-wrap{padding:0 22px;height:72px}.input-wrap input{font-size:21px}.submit{height:72px;font-size:22px}.foot{font-size:17px}}
  </style>
</head>
<body>
  <main class="access">
    <img class="mark" src="media/fuse-mark-palette.webp" alt="Fuse Atelier">
    <h1>Fuse Atelier</h1>
    <p class="tagline">Learn, Create and Sell</p>
    <h2 class="title">Access Fuse Atelier</h2>
    <p class="lead">Enter your name and email address to get in</p>
    <div class="notice"><span class="notice-icon">⚠</span><div><strong>Important:</strong> Use the same email address<br>you used when completing your purchase.<br>If you enter a different email, access will be<br>denied.</div></div>
    <form class="form" id="accessForm">
      <div class="field"><label for="name">Your Name</label><div class="input-wrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 6 0 0 1 16 0v3"/></svg><input id="name" autocomplete="name" placeholder="Your name" required></div></div>
      <div class="field"><label for="email">Email Address</label><div class="input-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" autocomplete="email" placeholder="your@email.com" required></div></div>
      <button class="submit" id="submit" type="submit">Get access</button>
      <p class="message" id="message" role="status"></p>
    </form>
    <p class="foot">Don't have access yet? <a href="/atelier">Get the Blueprint</a> <span class="arrow">→</span></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    const sb=supabase.createClient('https://rgbweaimkcndjznlazho.supabase.co','sb_publishable_S3IEOR8vkWkXEdGtx8fGjw_nH8c4fV3',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const form=document.getElementById('accessForm'),button=document.getElementById('submit'),message=document.getElementById('message');
    sb.auth.getSession().then(({data})=>{if(data.session)location.replace('/atelier-v2/home.html')});
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim();
      button.disabled=true;button.textContent='Checking access…';message.className='message';message.textContent='';
      try{
        const {error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:false,data:{full_name:name,name},emailRedirectTo:location.origin+'/atelier-v2/home.html'}});
        if(error)throw error;
        message.className='message ok';message.textContent='Your access link is on its way. Check your email to continue.';form.reset();
      }catch(error){message.textContent='We could not find access for that email. Please use the email from your purchase.'}
      finally{button.disabled=false;button.textContent='Get access'}
    });
  </script>
</body>
</html>
