<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#00191b">
  <title>Access Fuse Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--deep:#001012;--teal:#1b4c52;--field:#062125;--line:#315456;--chrome:linear-gradient(105deg,#ffe66a 0%,#dfff4e 48%,#eeffe0 100%);--lime:#dfff4e;--copy:#f5f8f6;--muted:#bad0cd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(112deg,var(--deep) 0%,#00191b 52%,var(--teal) 100%);color:var(--copy);font-family:Montserrat,Arial,sans-serif}html{background:#001012}body{width:min(430px,100%);max-width:430px;margin:0 auto;min-height:100svh;display:flex;justify-content:center;overflow-x:hidden}.access{width:100%;max-width:430px;min-height:100svh;padding:15px 42px 18px;display:flex;flex-direction:column;align-items:center;text-align:center}.mark{width:52px;height:52px;object-fit:contain;margin:0 0 8px;display:block;background:transparent}h1,.title{background:var(--chrome);background-clip:text;-webkit-background-clip:text;color:transparent;font-weight:500}h1{font-size:27px;line-height:1;letter-spacing:-1.7px;margin:0}.tagline{font-size:17px;line-height:1.18;font-weight:300;margin:14px 0 0}.title{font-size:28px;line-height:1.1;letter-spacing:-1.7px;margin:50px 0 17px}.lead{font-size:16px;line-height:1.2;font-weight:300;white-space:nowrap;margin:0 0 29px}.notice{width:100%;border:2px solid #9d8a2a;border-radius:21px;background:#18271d;color:#ffe75c;padding:13px 16px;display:flex;gap:10px;text-align:left;align-items:flex-start;font-size:13px;line-height:1.58;font-weight:300;margin-bottom:25px}.notice-copy{white-space:nowrap;letter-spacing:-.22px}.notice-icon{font-size:20px;line-height:1;margin-top:2px}.notice strong{font-weight:600}.form{width:100%}.field{width:100%;text-align:left;margin-bottom:22px}.field label{display:block;color:#ebfa48;font-size:17px;font-weight:400;margin:0 0 11px}.input-wrap{height:62px;border:2px solid var(--line);border-radius:15px;background:var(--field);display:flex;align-items:center;gap:16px;padding:0 22px}.input-wrap svg{width:23px;height:23px;stroke:#b9cecb;stroke-width:2;fill:none;flex:none}.input-wrap input{width:100%;border:0;outline:0;background:transparent;color:#f8fffb;font-size:18px;font-weight:300;min-width:0}.input-wrap input::placeholder{color:#b5c8c5;opacity:1}.submit{width:100%;height:62px;border:0;border-radius:15px;background:var(--chrome);color:#071411;font-size:18px;font-weight:500;box-shadow:0 10px 0 #29491b;cursor:pointer;margin-top:3px}.submit:disabled{opacity:.65}.message{min-height:0;margin:15px 0 0;font-size:13px;line-height:1.4;color:#ffb9a9}.message:empty{display:none}.message.ok{color:#dfff77}.foot{margin:27px 0 0;padding:0;font-size:16px;font-weight:300;line-height:1.35;white-space:nowrap}.foot a{color:var(--lime);font-weight:600;text-decoration:none}.arrow{font-size:20px}@media(max-width:390px){.access{padding-left:24px;padding-right:24px}.mark{width:46px;height:46px}h1{font-size:24px}.tagline{font-size:14px}.title{font-size:25px;margin-top:43px}.lead{font-size:14px}.notice{font-size:11.5px;padding:12px 9px;gap:7px;line-height:1.64}.notice-copy{letter-spacing:-.42px}.notice-icon{font-size:16px}.field label{font-size:16px}.input-wrap{padding:0 19px;height:58px}.input-wrap input{font-size:17px}.submit{height:58px;font-size:18px}.foot{font-size:14px}}
  </style>
</head>
<body>
  <main class="access">
    <img class="mark" src="media/fuse-mark-login-exact.png" alt="Fuse Atelier">
    <h1>Fuse Atelier</h1>
    <p class="tagline">Learn, Create and Sell</p>
    <h2 class="title">Access Fuse Atelier</h2>
    <p class="lead">Enter your name and email address to get in</p>
    <div class="notice"><span class="notice-icon">⚠</span><div class="notice-copy"><strong>Important:</strong> Use the same email address<br>you used when completing your purchase.<br>If you enter a different email, access will be denied.</div></div>
    <form class="form" id="accessForm">
      <div class="field"><label for="name">Your Name</label><div class="input-wrap"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 6 0 0 1 16 0v3"/></svg><input id="name" autocomplete="name" placeholder="Your name" required></div></div>
      <div class="field"><label for="email">Email Address</label><div class="input-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="email" type="email" autocomplete="email" placeholder="your@email.com" required></div></div>
      <button class="submit" id="submit" type="submit">Get access</button>
      <p class="message" id="message" role="status"></p>
    </form>
    <p class="foot">Don't have access yet? <a href="/atelier">Get the Blueprint</a> <span class="arrow">→</span></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    const sb=supabase.createClient('https://rgbweaimkcndjznlazho.supabase.co','sb_publishable_S3IEOR8vkWkXEdGtx8fGjw_nH8c4fV3',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const form=document.getElementById('accessForm'),button=document.getElementById('submit'),message=document.getElementById('message');
    sb.auth.getSession().then(({data})=>{if(data.session)location.replace('/atelier-v2/home.html')});
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase();
      button.disabled=true;button.textContent='Checking access…';message.className='message';message.textContent='';
      try{
        const {data:loginData,error:loginError}=await sb.functions.invoke('instant-login',{body:{email,name}});
        if(loginError||!loginData?.token_hash)throw loginError||new Error('Access denied');
        button.textContent='Signing you in…';
        const {data:authData,error:verifyError}=await sb.auth.verifyOtp({token_hash:loginData.token_hash,type:'email'});
        if(verifyError||!authData?.session)throw verifyError||new Error('Could not start session');
        localStorage.setItem('fuse_display_name',name);
        location.replace('/atelier-v2/home.html');
      }catch(error){
        message.textContent='We could not find access for that email. Please use the email from your purchase.';
        button.disabled=false;button.textContent='Get access';
      }
    });
  </script>
</body>
</html>
