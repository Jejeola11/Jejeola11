ll the possibilities.</h2><p>The Home visual language is grounded only in the first 20 AI videos you supplied — UGC, beauty, fashion and product campaigns.</p><div class="first20-tags"><span>UGC</span><span>BEAUTY</span><span>FASHION</span><span>PRODUCT</span></div></div>';made.parentNode.insertBefore(block,made)}const behavior=d.createElement('script');behavior.textContent=`setTimeout(()=>{const q=document.querySelector('.search input');document.querySelectorAll('.outcome-shortcuts button').forEach(b=>b.addEventListener('click',()=>{if(q){q.value=b.dataset.q;q.focus()}}));const tabs=[...document.querySelectorAll('.tabs button')];const targets=['.hero','#popular-workflows','.path','.first20'];tabs.forEach((b,n)=>b.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));b.classList.add('active');const target=document.querySelector(targets[n]);if(target&&n>0)target.scrollIntoView({behavior:'smooth',block:'start'})}));document.querySelectorAll('.filter').forEach(f=>f.addEventListener('click',()=>{const key=f.dataset.key||'all';document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));f.classList.add('active');document.querySelectorAll('.work').forEach(w=>w.classList.toggle('hidden-by-filter',key!=='all'&&w.dataset.cat!==key))}));const sheet=document.querySelector('.sheet');document.querySelectorAll('.tool,.workflow-card').forEach(el=>el.addEventListener('click',()=>sheet?.classList.add('open')))},50);`;d.body.appendChild(behavior);document.open();document.write('<!doctype html>'+d.documentElement.outerHTML);document.close()})().catch(e=>{document.body.innerHTML='<div class="loading"><div><div class="mark">!</div><b>Fuse preview could not load</b><p>'+e.message+'</p></div></div>'})</script></body></html>
