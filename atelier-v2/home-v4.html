<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02110f"><title>Fuse Atelier — Home V4</title><style>html,body{margin:0;min-height:100%;background:#02110f;color:#f8fff9;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center}.mark{width:58px;height:58px;border-radius:18px;margin:0 auto 14px;background:linear-gradient(135deg,#ffe568,#baff63 70%,#fff);display:grid;place-items:center;color:#07120f;font-size:28px;font-weight:950;box-shadow:0 20px 60px rgba(186,255,99,.15)}.loading b{font-size:20px}.loading p{color:#8ca39b;margin:6px 0 0;font-size:13px}</style></head><body><div class="loading"><div><div class="mark">✦</div><b>Loading Fuse Atelier</b><p>Building from your first 20 AI videos only.</p></div></div><script>(async()=>{const r=await fetch('./home-v3.html',{cache:'no-store'});const t=await r.text();const p=new DOMParser();const d=p.parseFromString(t,'text/html');const media=['/atelier-v2/media/beauty-snake.svg','/atelier-v2/media/burger-ugc.svg','/atelier-v2/media/luxury-bag.svg','/atelier-v2/media/watch-chameleon.svg'];let i=0;d.querySelectorAll('img').forEach(img=>{if((img.getAttribute('src')||'').includes('drive.google.com'))img.src=media[i++%media.length]});d.querySelectorAll('a').forEach(a=>{if((a.getAttribute('href')||'').includes('drive.google.com')){a.removeAttribute('href');a.removeAttribute('target')}});const h1=d.querySelector('.hero h1');if(h1)h1.innerHTML='Create work <em>people will pay for.</em>';const hp=d.querySelector('.hero p');if(hp)hp.textContent='Learn a skill, build client-ready work, package the service and move straight into client acquisition.';const heroLabels=[['Beauty campaign','AI creative direction'],['Luxury product story','Campaign-ready visual'],['Surreal product concept','AI commercial idea']];d.querySelectorAll('.hero-card').forEach((c,n)=>{const label=c.querySelector('.hero-label');if(label){label.innerHTML=heroLabels[n%heroLabels.length][0]+'<small style="display:block;color:#c5d8d0;font-weight:600;margin-top:2px">'+heroLabels[n%heroLabels.length][1]+'</small>'}});const createImgs=d.querySelectorAll('.tools img');createImgs.forEach((img,n)=>img.src=media[n%media.length]);const sectionHeads=[...d.querySelectorAll('.section .head h2')];const archiveHead=sectionHeads.find(x=>/creative archive|your ai work/i.test(x.textContent));if(archiveHead){archiveHead.textContent='From your first 20 AI videos';const section=archiveHead.closest('.section');const reels=section?.querySelector('.reels');if(reels){const cards=[['beauty-snake.svg','Beauty Campaign','AI Photos + Video'],['burger-ugc.svg','Creator UGC','Food / lifestyle ad'],['luxury-bag.svg','Luxury Product Story','Fashion campaign'],['watch-chameleon.svg','Surreal Product Ad','Commercial concept'],['beauty-snake.svg','Editorial Beauty','Premium visual direction']];reels.innerHTML=cards.map(c=>'<article class="reel"><div class="reel-media"><img src="/atelier-v2/media/'+c[0]+'" alt=""></div><div class="reel-copy"><b>'+c[1]+'</b><span>'+c[2]+'</span></div></article>').join('')}}const earn=d.querySelector('.earn-copy');if(earn){const h=earn.querySelector('h2');if(h)h.textContent='AI Product Campaigns';const q=earn.querySelector('p');if(q)q.textContent='Fashion, beauty and ecommerce brands buy launch visuals, short-form ads and product concepts like these.';const em=d.querySelector('.earn-media img');if(em)em.src=media[0]}const workNames=['Serpent Beauty Story','Luxury Handbag Story','Food Creator UGC','Watch × Chameleon','Editorial Product Visual','Minimal Luxury Editorial','Native UGC Concept','Surreal Watch Campaign'];const workSell=['Beauty campaign','Fashion launch','Creator ad','Luxury concept','Key visual','Editorial sample','Social ad','Premium commercial'];d.querySelectorAll('.work').forEach((w,n)=>{w.removeAttribute('href');w.removeAttribute('target');const img=w.querySelector('img');if(img)img.src=media[n%media.length];const b=w.querySelector('.work-copy b');if(b)b.textContent=workNames[n%workNames.length];const s=w.querySelector('.sell-tag');if(s)s.textContent='Sell as: '+workSell[n%workSell.length]});d.querySelectorAll('.work-copy b,.reel-copy b,.hero-label,.earn-copy p').forEach(el=>{el.innerHTML=el.innerHTML.replace(/multilingual|localized|international|english version launch video|spanish version launch video|french version launch video|german version launch video|italian version launch video/gi,'AI')});const style=d.createElement('style');style.textContent='.first20{margin-top:34px;border:1px solid #2c5d50;border-radius:24px;overflow:hidden;background:linear-gradient(130deg,#071c18,#0b2d26);display:grid;grid-template-columns:.9fr 1.1fr}.first20-grid{min-height:280px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px;padding:6px}.first20-grid img{border-radius:11px;min-width:0}.first20-copy{padding:28px;display:flex;flex-direction:column;justify-content:center}.first20-copy p{color:#8ca39b;line-height:1.5}.first20-chip{display:inline-flex;align-self:flex-start;padding:7px 10px;border:1px solid #3a6b5d;border-radius:999px;color:#baff63;font-size:10px;font-weight:900;letter-spacing:.08em}.first20-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.first20-tags span{padding:7px 9px;border-radius:999px;background:#0c3028;border:1px solid #315d52;font-size:9px;font-weight:900}@media(max-width:700px){.first20{grid-template-columns:1fr}.first20-grid{min-height:250px}.first20-copy{padding:20px}}';d.head.appendChild(style);const made=[...d.querySelectorAll('.section')].find(s=>s.querySelector('.head h2')?.textContent.trim()==='Made in Fuse');if(made){const block=d.createElement('section');block.className='first20';block.innerHTML='<div class="first20-grid"><img src="'+media[0]+'"><img src="'+media[1]+'"><img src="'+media[2]+'"><img src="'+media[3]+'"></div><div class="first20-copy"><span class="first20-chip">FIRST 20 ONLY</span><h2 style="margin:9px 0 0;font-size:30px">20 AI videos. One Fuse visual language.</h2><p>For this Home build, the creative direction is grounded only in the first 20 AI videos you supplied — UGC, beauty, fashion and product campaigns.</p><div class="first20-tags"><span>UGC</span><span>BEAUTY</span><span>FASHION</span><span>PRODUCT</span></div></div>';made.parentNode.insertBefore(block,made)}document.open();document.write('<!doctype html>'+d.documentElement.outerHTML);document.close()})().catch(e=>{document.body.innerHTML='<div class="loading"><div><div class="mark">!</div><b>Fuse preview could not load</b><p>'+e.message+'</p></div></div>'})</script></body></html>
