<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#001012"><title>Continue to Fuse Atelier</title><link rel="stylesheet" href="fuse.css?v=footer-earn-1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script><script src="fuse-shell.js?v=wealth-1" defer></script><style>body{font-family:Montserrat,Arial,sans-serif!important;background:#001012!important;color:#fff!important}.ref-wrap{min-height:70vh;display:grid;place-items:center;padding:28px}.ref-card{width:min(520px,100%);text-align:center;padding:28px 22px;border:1px solid #315456;border-radius:24px;background:#062125}.ref-card h1{font-size:25px;margin:0 0 10px}.ref-card p{color:#b7cbc8;line-height:1.5;font-size:15px}.logo{width:76px;height:76px;border-radius:22px;object-fit:cover;margin:0 auto 20px}.ref-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:14px;background:linear-gradient(110deg,#FFE66A,#DFFF4E,#EEFFE0);color:#001012;text-decoration:none;font-weight:700}</style></head><body data-page="earn"><div data-fuse-header></div><main class="ref-wrap"><section class="ref-card"><img class="logo" src="fuse-earn-logo.png" alt="Fuse Atelier"><h1>Continue to Fuse Atelier Core</h1><p>You’re being connected to the official checkout. Your referral has been recorded.</p><a class="ref-btn" id="continue" href="https://nestuge.com/fuse_atelier_core">Continue to checkout</a></section></main><script>window.addEventListener('load',async()=>{const code=new URLSearchParams(location.search).get('ref');if(!code)return;try{const sb=await Fuse.client();const visitor=localStorage.getItem('fuse_visitor_id')||crypto.randomUUID();localStorage.setItem('fuse_visitor_id',visitor);await sb.from('affiliate_referrals').insert({affiliate_code:code,visitor_id:visitor,status:'clicked'});}catch{}});</script></body></html>
