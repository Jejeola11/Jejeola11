<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02110f"><title>Fuse Atelier — Motion Home</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02110f}iframe{border:0;width:100%;height:100%;display:block;background:#02110f}</style></head><body><iframe id="app" src="./home-v4.html" title="Fuse Atelier"></iframe><script>(()=>{const frame=document.getElementById('app');const pad=n=>String(n).padStart(2,'0');const pool=[];for(let n=1;n<=26;n++)pool.push({src:'/atelier-site/assets/work/work-'+pad(n)+'.mp4',poster:'/atelier-site/assets/work/work-'+pad(n)+'-poster.jpg'});pool.push({src:'/app/media/samples/vid1.mp4',poster:'/app/media/samples/s1.jpg'},{src:'/app/media/samples/vid2.mp4',poster:'/app/media/samples/s2.jpg'},{src:'/app/media/samples/vid3.mp4',poster:'/app/media/samples/s3.jpg'},{src:'/app/media/samples/vid4.mp4',poster:'/app/media/samples/s4.jpg'},{src:'/app/media/samples/vid5.mp4',poster:'/app/media/samples/s5.jpg'},{src:'/app/media/showcase/vid-ugc-skincare.mp4',poster:'/atelier-site/assets/showcase/vid-ugc-skincare-poster.jpg'},{src:'/app/media/showcase/vid-cgi-explosion.mp4',poster:'/atelier-site/assets/showcase/vid-cgi-explosion-poster.jpg'},{src:'/app/media/showcase/vid-ai-avatar-man.mp4',poster:'/atelier-site/assets/showcase/vid-ai-avatar-man-poster.jpg'},{src:'/app/media/showcase/vid-fuse-office.mp4',poster:'/atelier-site/assets/showcase/vid-fuse-office-poster.jpg'});let cursor=0;const next=()=>pool[cursor++%pool.length];function patch(){let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(e){return}if(!d||!d.querySelector('.hero-card'))return setTimeout(patch,120);if(d.documentElement.dataset.motionV5)return;d.documentElement.dataset.motionV5='1';const css=d.createElement('style');css.textContent='.hero-card video,.lesson-thumb video,.thumb video,.workflow-card video,.reel-media video,.earn-media video,.work-visual video,.first20-grid video{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;background:#061713}.hero-card video,.workflow-card video,.thumb video,.reel-media video,.earn-media video,.work-visual video,.lesson-thumb video{position:absolute;inset:0}.hero-card,.workflow-card,.thumb,.reel-media,.earn-media,.work-visual,.lesson-thumb{position:relative;overflow:hidden}.hero-card video{transform:scale(1.01)}.live-pill{pointer-events:none}.first20-grid video{border-radius:11px;min-width:0}video::-webkit-media-controls{display:none!important}@media(max-width:620px){.hero-card video{object-position:center 38%}}';d.head.appendChild(css);const make=(item,priority=false)=>{const v=d.createElement('video');v.src=item.src;if(item.poster)v.poster=item.poster;v.muted=true;v.defaultMuted=true;v.autoplay=true;v.loop=true;v.playsInline=true;v.preload=priority?'auto':'metadata';v.setAttribute('muted','');v.setAttribute('autoplay','');v.setAttribute('loop','');v.setAttribute('playsinline','');v.setAttribute('disablepictureinpicture','');if(priority)v.dataset.priority='1';return v};const replace=(img,priority=false)=>{if(!img)return;const v=make(next(),priority);if(img.className)v.className=img.className;img.replaceWith(v)};[...d.querySelectorAll('.hero-card img')].forEach(img=>replace(img,true));[...d.querySelectorAll('.lesson-thumb img')].forEach(img=>replace(img));[...d.querySelectorAll('.tools img')].forEach(img=>replace(img));[...d.querySelectorAll('.workflow-card img')].forEach(img=>replace(img));[...d.querySelectorAll('.reel-media img')].forEach(img=>replace(img));[...d.querySelectorAll('.earn-media img')].forEach(img=>replace(img));[...d.querySelectorAll('.work-visual img')].forEach(img=>replace(img));[...d.querySelectorAll('.first20-grid img')].forEach(img=>replace(img));const h=[...d.querySelectorAll('.section .head h2')].find(x=>/first 20 ai videos/i.test(x.textContent));if(h)h.textContent='Your AI work in motion';const vault=d.querySelector('.first20-copy p');if(vault)vault.textContent='A growing library of real AI video work across UGC, beauty, fashion, product and campaign concepts — shown in motion, with more variety and far less repetition.';const videos=[...d.querySelectorAll('video')];const play=v=>{v.muted=true;v.defaultMuted=true;v.playsInline=true;const p=v.play();if(p&&p.catch)p.catch(()=>{})};const tune=()=>{const H=w.innerHeight||800;videos.forEach(v=>{const r=v.getBoundingClientRect();const near=r.bottom>-220&&r.top<H+220;if(near){v.dataset.inview='1';play(v)}else{v.dataset.inview='0';if(!v.dataset.priority)v.pause()}})};let ticking=false;w.addEventListener('scroll',()=>{if(ticking)return;ticking=true;w.requestAnimationFrame(()=>{tune();ticking=false})},{passive:true});w.addEventListener('resize',tune,{passive:true});d.addEventListener('visibilitychange',()=>{if(d.hidden)videos.forEach(v=>v.pause());else tune()});videos.filter(v=>v.dataset.priority==='1').forEach(play);setTimeout(tune,80);setTimeout(tune,700)}frame.addEventListener('load',()=>setTimeout(patch,100));setTimeout(patch,450);setTimeout(patch,1200)})()</script></body></html>
