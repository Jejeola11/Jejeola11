<script>
window.addEventListener('load',async()=>{const linkEl=document.getElementById('affiliateLink'),copy=document.getElementById('copyLink');try{const sb=await Fuse.client();const session=await Fuse.session();const user=session.user;const slugify=v=>String(v||'').toLowerCase().normalize('NFKD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,32);let row=null;try{const q=await sb.from('affiliate_applications').select('affiliate_code,full_name').eq('user_id',user.id).maybeSingle();if(!q.error)row=q.data;}catch{}const name=row?.full_name||user.user_metadata?.full_name||user.user_metadata?.name||user.email?.split('@')[0]||'creator';const code=row?.affiliate_code||('fuse-'+slugify(name)+'-'+user.id.replace(/-/g,'').slice(-6).toLowerCase());const link='https://fuseatelier.com/atelier-v2/ref.html?ref='+encodeURIComponent(code);linkEl.value=link;const q2=await sb.from('affiliate_referrals').select('status').eq('affiliate_code',code);const refs=q2.error?[]:(q2.data||[]),converted=refs.filter(r=>r.status==='converted').length;document.getElementById('clicks').textContent=refs.length;document.getElementById('referrals').textContent=converted;document.getElementById('conversion').textContent=refs.length?Math.round(converted/refs.length*100)+'%':'0%';copy.onclick=async()=>{try{await navigator.clipboard.writeText(link);copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy',1600)}catch{linkEl.select()}};}catch(e){console.error('affiliate dashboard load',e);linkEl.value='Sign in from Home to view your link';copy.disabled=true;}});
</script></body></html>
