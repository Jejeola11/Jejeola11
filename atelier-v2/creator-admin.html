<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator review · Fuse</title><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script><link rel="stylesheet" href="fuse.css?v=footer-earn-1"><script src="fuse-shell.js?v=wealth-1" defer></script><style>body{font-family:Montserrat;background:#001012;color:#eeffe0}.wrap{max-width:760px;margin:auto;padding:24px 16px 110px}.card{background:#062125;border:1px solid #315456;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 12px 28px #0006}.k{color:#dfff4e;letter-spacing:1.5px;font-weight:700;font-size:12px}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#b7cbc8;border-bottom:1px solid #315456;padding:10px 0}.row strong{color:#fff}.actions{display:flex;gap:8px;margin-top:14px}.actions button{border:0;border-radius:10px;padding:11px 13px;font:700 12px Montserrat}.approve{background:#dfff4e}.changes{background:#ffe66a}.reject{background:#ff9b9b}</style></head><body data-page="earn"><div data-fuse-header></div><main class="wrap"><div class="k">ADMIN REVIEW</div><h1>Creator submissions</h1><p id="status">Loading…</p><div id="list"></div></main><script>window.addEventListener('load',async()=>{const list=document.getElementById('list');try{const sb=await Fuse.client(),s=await Fuse.session();if(s?.user?.email!=='riadigitals0@gmail.com')throw Error('Owner access only.');const {data,error}=await sb.from('creator_submissions').select('*').order('created_at',{ascending:false});if(error)throw error;status.textContent=(data||[]).length+' submission(s)';(data||[]).forEach(x=>{const el=document.createElement('section');el.className='card';el.innerHTML='<div class="k">'+x.status.toUpperCase()+'</div><h2>'+x.full_name+'</h2><div class="row"><span>'+x.email+'</span><strong>'+x.platform+'</strong></div><div class="row"><span>Views</span><strong>'+x.views.toLocaleString()+'</strong></div><div class="row"><a href="'+x.post_url+'" target="_blank" rel="noopener" style="color:#dfff4e">Open submitted video ↗</a></div><div class="actions"><button class="approve">Approve</button><button class="changes">Needs changes</button><button class="reject">Reject</button></div>';el.querySelector('.approve').onclick=()=>review(x.id,'approved',el);el.querySelector('.changes').onclick=()=>review(x.id,'needs_changes',el);el.querySelector('.reject').onclick=()=>review(x.id,'rejected',el);list.appendChild(el);});async function review(id,state,el){const reward=state==='approved'?Number(prompt('Reward in ₦ (optional)','0')||0):0;const note=prompt('Admin note (optional)','')||null;const {error}=await sb.from('creator_submissions').update({status:state,reward_naira:reward,admin_note:note,reviewed_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else{el.querySelector('.k').textContent=state.toUpperCase();}}}catch(e){status.textContent=e.message;}});</script></body></html>
