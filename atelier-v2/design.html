<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020907"><title>Flyer designer · Fuse Atelier</title><link rel="stylesheet" href="fuse.css"><script src="fuse-shell.js" defer></script><script src="design.js" defer></script></head><body data-page="create"><div data-fuse-header></div><main class="fuse-wrap"><div class="fuse-heading"><div><div class="eyebrow">Free tool · no generation charge</div><h1>Design a flyer.</h1></div></div><div class="studio-grid"><form class="panel" id="designForm"><label class="field"><span>Headline</span><input id="headline" maxlength="80" value="Your next big idea."></label><label class="field"><span>Supporting text</span><textarea id="detail" maxlength="200">Make something worth sharing.</textarea></label><label class="field"><span>Brand or contact</span><input id="brand" maxlength="60" value="FUSE ATELIER"></label><label class="field"><span>Background image (optional)</span><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="row"><label class="field"><span>Background colour</span><input id="background" type="color" value="#041009"></label><label class="field"><span>Text colour</span><input id="foreground" type="color" value="#baff63"></label></div><button id="export" type="button" class="btn primary wide">Download PNG</button><p id="designStatus" role="status" class="status">Edits stay on this device. Download to keep your work.</p></form><section class="panel"><canvas id="canvas" width="1080" height="1350" style="width:100%;height:auto;display:block" aria-label="Live flyer preview"></canvas></section></div></main></body></html>
