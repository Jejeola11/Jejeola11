<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02110f">
<title>Fuse Community</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#02110f;--panel:#071d18;--panel2:#0a2921;--line:#285044;--lime:#baff63;--yellow:#ffe568;--text:#f6fff9;--muted:#91a69e;--grad:linear-gradient(110deg,#ffe568,#baff63)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -8%,#164638 0,transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;padding-bottom:92px}button,input,textarea{font:inherit}.hidden{display:none!important}.shell{width:min(760px,calc(100% - 24px));margin:auto}
.top{position:sticky;top:0;z-index:20;background:#02110fea;backdrop-filter:blur(18px);border-bottom:1px solid #baff6318}.topin{height:66px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:950;letter-spacing:-.04em}.brand span{color:var(--lime)}.back,.icon{border:1px solid var(--line);background:var(--panel);color:white;border-radius:12px;padding:9px 12px;font-weight:800}.account{font-size:10px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:18px 0}.hero{border:1px solid #5c8d7a66;border-radius:26px;padding:22px;background:linear-gradient(145deg,#09251f,#061a16);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-75px;top:-85px;background:radial-gradient(circle,#baff633d,transparent 68%)}.eyebrow{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);font-weight:950}.hero h1{font-size:clamp(34px,8vw,54px);line-height:.94;letter-spacing:-.055em;margin:8px 0 10px;max-width:560px}.hero h1 em{font-style:normal;color:var(--yellow)}.hero p{font-size:12px;line-height:1.55;color:#afc2bb;max-width:600px;margin:0}.online{display:inline-flex;align-items:center;gap:7px;margin-top:14px;border:1px solid #baff6340;border-radius:999px;padding:7px 10px;font-size:9px;font-weight:850}.online i{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 15px var(--lime)}
.composer{margin-top:13px;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:14px}.composer textarea,.composer input,.reply-input{width:100%;border:1px solid #315d50;border-radius:13px;background:#031612;color:white;padding:11px;outline:0}.composer textarea{min-height:88px;resize:vertical}.composer input{height:43px;margin-top:7px;font-size:11px}.composer textarea:focus,.composer input:focus,.reply-input:focus{border-color:var(--lime)}.composebar{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:9px}.tag{display:flex;align-items:center;gap:6px;color:#c4d4ce;font-size:10px}.tag input{width:auto;height:auto;margin:0;accent-color:var(--lime)}.primary{border:0;border-radius:12px;background:var(--grad);color:#07120f;font-weight:950;padding:10px 15px}.primary:disabled{opacity:.55}
.feed-head{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 10px}.feed-head h2{font-size:22px;margin:3px 0 0;letter-spacing:-.04em}.feed-head button{border:0;background:none;color:var(--lime);font-size:10px;font-weight:850}.feed{display:grid;gap:10px}.post{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#071f19,#061814);padding:14px}.posttop{display:flex;justify-content:space-between;gap:10px}.who{display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#07120f;font-weight:950}.who b{display:block;font-size:12px}.who small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.ria{display:inline-block;color:#07120f;background:var(--yellow);border-radius:999px;padding:4px 7px;font-size:7px;font-weight:950}.postbody{font-size:12px;line-height:1.55;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.media{display:block;border:1px solid var(--line);border-radius:12px;padding:9px 10px;color:var(--lime);font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.postactions{display:flex;gap:7px;margin-top:10px}.small{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:#dce9e4;padding:7px 9px;font-size:8px;font-weight:850}.small.danger{color:#ffb8b8}.replies{margin-top:10px;border-top:1px solid #ffffff0c;padding-top:9px}.reply{padding:7px 0;font-size:10px;line-height:1.45}.reply b{color:var(--lime);margin-right:5px}.replyform{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:6px}.reply-input{height:38px;font-size:10px}.empty{border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted);font-size:11px}.message{font-size:10px;color:#ffb4a0;margin-top:8px;min-height:14px}.auth{min-height:75vh;display:grid;place-items:center}.authcard{width:min(420px,100%);border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:22px}.authcard h1{font-size:31px;letter-spacing:-.05em;margin:8px 0}.authcard p{color:var(--muted);font-size:11px;line-height:1.5}.authcard a{display:block;text-align:center;margin-top:14px;text-decoration:none}
.bottom{position:fixed;bottom:0;left:0;right:0;height:76px;background:#031713f5;border-top:1px solid #baff631a;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:30}.bottom a{color:#87a098;text-decoration:none;text-align:center;font-size:8px;font-weight:850}.bottom a span{display:block;font-size:18px;margin-bottom:3px}.bottom a.active{color:var(--lime)}.bottom .create{width:58px;height:58px;margin:-23px auto 0;border-radius:18px;background:var(--grad);color:#07120f;display:grid;place-items:center;font-size:23px}
@media(max-width:520px){.account{display:none}.hero{padding:19px 16px}.hero h1{font-size:39px}.composer{padding:12px}.post{padding:12px}.composebar{align-items:flex-end}.bottom{height:72px}}
</style><link rel="stylesheet" href="/atelier-v2/fuse.css?v=teal-1"><script src="/atelier-v2/fuse-shell.js?v=teal-1" defer></script><script src="/atelier-v2/legacy-bridge.js" defer></script></head>
<body data-page="community"><div data-fuse-header></div>
<header class="top"><div class="shell topin"><button class="back" onclick="location.href='/atelier-v2/'">←</button><div class="brand">Fuse <span>Community</span></div><span id="account" class="account"></span></div></header>
<main class="shell">
  <section id="auth" class="auth hidden"><div class="authcard"><div class="eyebrow">MEMBERS ONLY</div><h1>Join the room.</h1><p>Sign in from the Fuse Atelier home screen first, then return here to share your work and get feedback.</p><a class="primary" href="/atelier-v2/">Go to sign in →</a></div></section>
  <div id="app" class="hidden">
    <section class="hero"><h1>Community</h1><p>Share work. Ask for feedback.</p></section>
    <section class="composer"><textarea id="body" maxlength="1800" placeholder="Message the community…"></textarea><input id="media" type="url" placeholder="Optional link to your work (Drive, Instagram, portfolio…)"><div class="composebar"><label class="tag"><input id="tagRia" type="checkbox"> Tag @Ria for feedback</label><button id="postBtn" class="primary">Send →</button></div><div id="message" class="message"></div></section>
    <div class="feed-head"><div><div class="eyebrow">COMMUNITY FEED</div><h2>Latest conversations</h2></div><button id="refresh">Refresh ↻</button></div>
    <section id="feed" class="feed"></section>
  </div>
</main>
<nav class="bottom"><a href="/atelier-v2/"><span>⌂</span>Home</a><a href="/atelier-v2/academy-v2.html"><span>◇</span>Academy</a><a class="create" href="/atelier-v2/create.html">✦</a><a href="/atelier-v2/clients.html"><span>◎</span>Clients</a><a class="active" href="/atelier-v2/community.html"><span>◉</span>Community</a></nav>
<script>
(()=>{
const SUPABASE_URL='https://rgbweaimkcndjznlazho.supabase.co',KEY='sb_publishable_S3IEOR8vkWkXEdGtx8fGjw_nH8c4fV3';
const sb=supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let session=null,posts=[];
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const name=()=>session?.user?.email?.split('@')[0]||'Fuse creator';
const ago=v=>{const s=Math.max(1,Math.floor((Date.now()-new Date(v))/1000));if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'};
function safeMedia(value){try{return ["https:","http:"].includes(new URL(value).protocol)}catch{return false}}
function render(){const replies=posts.flatMap(p=>p.community_replies||[]);$('feed').innerHTML=posts.length?posts.map(p=>`<article class="post"><div class="posttop"><div class="who"><div class="avatar">${esc((p.author_name||'F')[0].toUpperCase())}</div><div><b>${esc(p.author_name)}</b><small>${ago(p.created_at)}</small></div></div>${p.tag_ria?'<span class="ria">@RIA TAGGED</span>':''}</div><div class="postbody">${esc(p.body)}</div>${safeMedia(p.media_url)?`<a class="media" href="${esc(p.media_url)}" target="_blank" rel="noopener">↗ Open shared work</a>`:''}<div class="postactions"><button class="small" data-reply-toggle="${p.id}">${(p.community_replies||[]).length} replies</button>${p.user_id===session.user.id?`<button class="small danger" data-delete="${p.id}">Delete</button>`:''}</div><div class="replies hidden" id="replies-${p.id}">${(p.community_replies||[]).map(r=>`<div class="reply"><b>@${esc(r.author_name)}</b>${esc(r.body)}</div>`).join('')}<div class="replyform"><input class="reply-input" id="reply-${p.id}" maxlength="800" placeholder="Write a helpful reply…"><button class="small" data-send-reply="${p.id}">Send</button></div></div></article>`).join(''):'<div class="empty">No posts yet. Share the first piece of work with the Fuse community.</div>';
$('feed').querySelectorAll('[data-reply-toggle]').forEach(b=>b.onclick=()=>$('replies-'+b.dataset.replyToggle).classList.toggle('hidden'));
$('feed').querySelectorAll('[data-send-reply]').forEach(b=>b.onclick=()=>reply(b.dataset.sendReply));
$('feed').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete));
}
async function load(){const{data,error}=await sb.from('community_posts').select('*,community_replies(*)').order('created_at',{ascending:false}).limit(80);if(error){$('feed').innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}posts=(data||[]).map(p=>({...p,community_replies:(p.community_replies||[]).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at))}));render()}
async function post(){const body=$('body').value.trim(),media=$('media').value.trim();if(!body)return $('message').textContent='Write something before posting.';if(media){try{if(!["https:","http:"].includes(new URL(media).protocol))throw Error("Unsafe link")}catch{return $('message').textContent='Check the link to your work.'}}$('postBtn').disabled=true;$('postBtn').textContent='Posting…';const{error}=await sb.from('community_posts').insert({user_id:session.user.id,author_name:name(),body,media_url:media||null,tag_ria:$('tagRia').checked});$('postBtn').disabled=false;$('postBtn').textContent='Send →';if(error)return $('message').textContent=error.message;$('body').value='';$('media').value='';$('tagRia').checked=false;$('message').textContent='Posted ✓';await load()}
async function reply(id){const input=$('reply-'+id),body=input.value.trim();if(!body)return;const{error}=await sb.from('community_replies').insert({post_id:id,user_id:session.user.id,author_name:name(),body});if(error)return alert(error.message);input.value='';await load();setTimeout(()=>$('replies-'+id)?.classList.remove('hidden'),0)}
async function remove(id){if(!confirm('Delete this community post?'))return;const{error}=await sb.from('community_posts').delete().eq('id',id);if(error)return alert(error.message);await load()}
async function boot(){const{data}=await sb.auth.getSession();session=data.session;if(!session){$('auth').classList.remove('hidden');return}$('app').classList.remove('hidden');$('account').textContent=session.user.email;$('postBtn').onclick=post;$('refresh').onclick=load;await load()}
boot();
})();
</script></body></html>
