<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1011">
  <title>Library · Fuse Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <style>
    :root{
      --deep:#001012;--mid:#00191B;--light:#1B4C52;--surface:#121719;--surface2:#181d1f;
      --line:#315456;--muted:#8e9999;--yellow:#FFE66A;--lime:#DFFF4E;--white:#EEFFE0;
      --chrome:linear-gradient(105deg,#FFE66A 0%,#DFFF4E 52%,#EEFFE0 100%);
    }
    *{box-sizing:border-box}
    html{background:#0b0e0f}
    body{
      margin:0;min-height:100svh;background:#0d1011;color:#f4f6f5;font-family:Montserrat,Arial,sans-serif;
      padding-bottom:calc(118px + env(safe-area-inset-bottom));overflow-x:hidden;
    }
    button{font:inherit;cursor:pointer}
    .page{width:min(820px,100%);margin:0 auto}
    .top{
      position:sticky;top:0;z-index:30;background:rgba(13,16,17,.96);backdrop-filter:blur(18px);
      padding:20px 24px 12px;border-bottom:1px solid rgba(255,255,255,.025)
    }
    .top-row{display:flex;align-items:center;justify-content:space-between;gap:18px}
    .title-wrap{display:flex;align-items:center;gap:13px;min-width:0}
    .folder{width:28px;height:22px;border-radius:3px;background:#9da0a2;position:relative;flex:none}
    .folder:before{content:"";position:absolute;left:1px;top:-5px;width:13px;height:7px;border-radius:3px 3px 0 0;background:#9da0a2}
    h1{margin:0;font-size:27px;line-height:1;font-weight:600;letter-spacing:-.7px}
    .layout-toggle{
      display:flex;gap:3px;background:#121619;border:1px solid rgba(255,255,255,.055);border-radius:17px;padding:4px
    }
    .layout-toggle button{width:42px;height:42px;border:0;border-radius:13px;background:transparent;color:#8b8f90;display:grid;place-items:center}
    .layout-toggle button.on{background:#333638;color:#fff}
    .layout-toggle svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}

    .filters{
      display:flex;gap:10px;overflow:auto;scrollbar-width:none;padding:16px 24px 4px;margin:0 -24px;
      overscroll-behavior-inline:contain
    }
    .filters::-webkit-scrollbar{display:none}
    .filter{
      flex:none;height:48px;border:0;border-radius:15px;padding:0 18px;background:#181d1f;color:#eef0ef;
      display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;white-space:nowrap
    }
    .filter.on{background:#393c3e}
    .filter svg{width:19px;height:19px;stroke:#969a9b;fill:none;stroke-width:1.6}
    .filter.on svg{stroke:#fff}

    .status{min-height:20px;margin:14px 24px 0;color:#8d9696;font-size:12px;font-weight:300}
    .groups{padding:4px 24px 20px}
    .group{margin-top:25px}
    .group-title{margin:0 0 18px;font-size:20px;font-weight:600;letter-spacing:-.35px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .grid.list{grid-template-columns:1fr;gap:10px}
    .tile{
      position:relative;aspect-ratio:1;border:0;padding:0;border-radius:14px;overflow:hidden;background:#171b1d;
      color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)
    }
    .grid.list .tile{aspect-ratio:auto;min-height:84px;display:grid;grid-template-columns:84px 1fr}
    .tile img,.tile video{width:100%;height:100%;display:block;object-fit:cover;background:#111}
    .grid.list .tile img,.grid.list .tile video{width:84px;height:84px}
    .tile video{pointer-events:none}
    .audio-art{
      width:100%;height:100%;display:grid;place-items:center;background:
      radial-gradient(circle at 50% 40%,rgba(223,255,78,.16),transparent 35%),
      linear-gradient(145deg,#10282b,#101314)
    }
    .audio-art svg{width:34%;height:34%;stroke:#dfff4e;fill:none;stroke-width:1.4}
    .list-copy{display:none;text-align:left;padding:13px 14px;min-width:0}
    .grid.list .list-copy{display:block}
    .list-copy b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .list-copy span{display:block;margin-top:6px;color:#8d9696;font-size:11px;font-weight:300}
    .kind-badge{
      position:absolute;left:7px;bottom:7px;border-radius:999px;background:rgba(5,8,9,.72);backdrop-filter:blur(8px);
      padding:4px 7px;font-size:8px;font-weight:500;color:#e7ecea;text-transform:uppercase;letter-spacing:.03em
    }
    .grid.list .kind-badge{display:none}
    .processing{
      background:
        radial-gradient(circle at 50% 42%,rgba(223,255,78,.06),transparent 38%),
        linear-gradient(145deg,#171c1d,#0f1314)
    }
    .processing-inner{position:absolute;inset:0;display:grid;place-items:center}
    .spinner{
      width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.13);border-top-color:#DFFF4E;
      animation:spin .82s linear infinite
    }
    .processing small{position:absolute;left:8px;right:8px;bottom:10px;color:#9aa3a2;font-size:8px;font-weight:400}
    .failed{background:#221719}
    .failed .processing-inner{color:#ffb8b8;font-size:11px;padding:12px}
    @keyframes spin{to{transform:rotate(360deg)}}

    .empty{padding:70px 26px;text-align:center;color:#8b9594;font-size:14px;font-weight:300}
    .continue{
      position:fixed;z-index:45;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
      border:1px solid rgba(255,255,255,.07);border-radius:16px;background:#171b1d;color:#d8dcdb;
      min-height:48px;padding:0 20px;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;
      box-shadow:0 12px 34px rgba(0,0,0,.32);white-space:nowrap;text-decoration:none
    }
    .continue i{font-style:normal;color:#DFFF4E;font-size:24px;line-height:1}

    .nav{
      position:fixed;z-index:44;left:0;right:0;bottom:0;height:calc(82px + env(safe-area-inset-bottom));
      padding:6px max(8px,calc((100vw - 700px)/2)) calc(6px + env(safe-area-inset-bottom));
      background:rgba(11,14,15,.98);border-top:1px solid rgba(255,255,255,.025);
      display:grid;grid-template-columns:repeat(5,1fr)
    }
    .nav a{
      color:#8f9494;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
      font-size:10px;font-weight:500
    }
    .nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .nav .create svg{width:54px;height:49px;padding:12px;border-radius:15px;background:#DFFF4E;color:#0c0f10}
    .nav .active{color:#fff}

    .detail{position:fixed;inset:0;z-index:100;background:#0d1011;display:none;overflow:auto;padding-bottom:34px}
    .detail.open{display:block}
    .detail-inner{width:min(760px,100%);margin:0 auto;padding:20px 24px 40px}
    .detail-close{
      position:sticky;top:16px;z-index:4;margin-left:auto;width:52px;height:52px;border:0;border-radius:50%;
      background:#1c2022;color:#929899;display:grid;place-items:center
    }
    .detail-close:before,.detail-close:after{content:"";position:absolute;width:22px;height:1.5px;background:currentColor}
    .detail-close:before{transform:rotate(45deg)}.detail-close:after{transform:rotate(-45deg)}
    .hero-media{margin:34px auto 28px;width:min(70vw,500px);max-height:68svh;display:grid;place-items:center}
    .hero-media img,.hero-media video{max-width:100%;max-height:68svh;border-radius:2px;object-fit:contain}
    .hero-media audio{width:100%}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}
    .action{
      min-height:82px;border:0;border-radius:16px;background:#171b1d;color:#fff;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:600
    }
    .action.primary{background:#DFFF4E;color:#0b0e0f}
    .action svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
    .prompt-card{border-radius:18px;background:#161a1c;padding:16px;margin-top:12px}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;color:#929899}
    .card-head b{font-size:12px;font-weight:600;letter-spacing:.04em}
    .copy{height:34px;padding:0 11px;border:1px solid #34393a;border-radius:9px;background:#171b1d;color:#fff;font-size:12px}
    .prompt-box{background:#272b2d;border-radius:14px;padding:18px;color:#f0f2f1;font-size:15px;line-height:1.55;font-weight:400}
    .prompt-box.collapsed{max-height:210px;overflow:hidden;mask-image:linear-gradient(to bottom,#000 72%,transparent)}
    .see{margin-top:10px;border:0;background:none;color:#9da3a3;font-size:13px;font-weight:500}
    .details{border-radius:18px;background:#161a1c;padding:15px 18px;margin-top:12px}
    .details-title{font-size:12px;font-weight:600;color:#929899;margin-bottom:12px}
    .detail-row{display:flex;justify-content:space-between;gap:20px;padding:6px 0;font-size:13px}
    .detail-row span:first-child{color:#8d9494}.detail-row span:last-child{text-align:right}
    @media(max-width:520px){
      .top{padding:18px 16px 10px}.filters{padding-left:16px;padding-right:16px;margin-left:-16px;margin-right:-16px}
      h1{font-size:25px}.groups{padding-left:16px;padding-right:16px}.status{margin-left:16px;margin-right:16px}
      .group{margin-top:23px}.group-title{font-size:19px;margin-bottom:15px}.grid{gap:8px}.tile{border-radius:13px}
      .detail-inner{padding:18px 16px 34px}.hero-media{width:min(82vw,500px);margin-top:26px}
      .actions{gap:8px}.action{min-height:78px;font-size:12px}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="top-row">
        <div class="title-wrap"><span class="folder" aria-hidden="true"></span><h1>Library</h1></div>
        <div class="layout-toggle" aria-label="Library layout">
          <button id="listView" type="button" aria-label="List view"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
          <button id="gridView" class="on" type="button" aria-label="Grid view"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
        </div>
      </div>
      <nav class="filters" id="filters" aria-label="Library filters">
        <button class="filter on" data-filter="all"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="9" rx="1"/><rect x="9" y="10" width="11" height="9" rx="1"/></svg>All</button>
        <button class="filter" data-filter="video"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg>Video</button>
        <button class="filter" data-filter="image"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m6 17 4-4 3 3 2-2 3 3"/></svg>Image</button>
        <button class="filter" data-filter="audio"><svg viewBox="0 0 24 24"><path d="M5 12v4M9 8v8M13 5v14M17 9v6M21 11v2"/></svg>Audio</button>
        <button class="filter" data-filter="twin"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="16" cy="10" r="2.5"/><path d="M3 20c0-4 2.6-6 6-6s6 2 6 6M13 16c.8-1.4 2-2 3.5-2 2.5 0 4.5 1.8 4.5 5"/></svg>Twin</button>
      </nav>
    </header>
    <div class="status" id="libraryStatus"></div>
    <section class="groups" id="libraryGroups"></section>
  </main>

  <a class="continue" href="studio.html"><i>✦</i> Continue to Create</a>

  <nav class="nav" aria-label="Main navigation">
    <a href="home.html"><svg viewBox="0 0 24 24"><path d="M4 10 12 3l8 7v10h-6v-6h-4v6H4z"/></svg><span>Home</span></a>
    <a href="learn.html"><svg viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5zM5 11v7q7 5 14 0v-7"/></svg><span>Academy</span></a>
    <a class="create" href="studio.html"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg><span>Create</span></a>
    <a class="active" href="library.html"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span>Library</span></a>
    <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22v-3a8 6 0 0 1 16 0v3"/></svg><span>Profile</span></a>
  </nav>

  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-inner">
      <button class="detail-close" id="detailClose" type="button" aria-label="Close"></button>
      <div class="hero-media" id="detailMedia"></div>
      <div class="actions">
        <button class="action primary" id="editAction" type="button"><svg viewBox="0 0 24 24"><path d="m4 20 4-1 11-11-3-3L5 16z"/><path d="m14 6 3 3"/></svg><span>Edit</span></button>
        <button class="action" id="recreateAction" type="button"><svg viewBox="0 0 24 24"><path d="M19 7V3l-3 3a7 7 0 1 0 2 10"/><path d="M5 17v4l3-3"/></svg><span>Recreate</span></button>
        <button class="action" id="videoAction" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg><span>Create Video</span></button>
        <button class="action" id="favAction" type="button"><svg viewBox="0 0 24 24"><path d="M12 20s-8-4.7-8-10a4 4 0 0 1 7-2.6A4 4 0 0 1 18 10c0 5.3-6 10-6 10z"/></svg><span>Favourite</span></button>
        <button class="action" id="downloadAction" type="button"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg><span>Download</span></button>
        <button class="action" id="moreAction" type="button"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>More</span></button>
      </div>
      <div class="prompt-card">
        <div class="card-head"><b>PROMPT</b><button class="copy" id="copyPrompt" type="button">Copy</button></div>
        <div class="prompt-box collapsed" id="detailPrompt"></div>
        <button class="see" id="seePrompt" type="button">See all⌄</button>
      </div>
      <div class="details">
        <div class="details-title">ⓘ &nbsp; DETAILS</div>
        <div class="detail-row"><span>Model</span><span id="detailModel">—</span></div>
        <div class="detail-row"><span>Type</span><span id="detailKind">—</span></div>
        <div class="detail-row"><span>Aspect</span><span id="detailAspect">—</span></div>
        <div class="detail-row"><span>Credits</span><span id="detailCredits">—</span></div>
        <div class="detail-row"><span>Created</span><span id="detailCreated">—</span></div>
      </div>
    </div>
  </section>

  <script src="library.js?v=library-higgsfield-1" defer></script>
</body>
</html>
