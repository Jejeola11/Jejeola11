<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#001012">
  <title>Library · Fuse Atelier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <style>
    :root{
      --deep:#001012;
      --mid:#00191B;
      --light:#1B4C52;
      --surface:#062125;
      --line:#315456;
      --yellow:#FFE66A;
      --lime:#DFFF4E;
      --white:#EEFFE0;
      --chrome:linear-gradient(105deg,#FFE66A 0%,#DFFF4E 52%,#EEFFE0 100%);
      --muted:#9db2b1;
    }
    *{box-sizing:border-box}
    html{background:var(--deep)}
    body{
      margin:0;
      min-height:100svh;
      overflow-x:hidden;
      color:var(--white);
      font-family:Montserrat,Arial,sans-serif;
      font-weight:500;
      background:
        radial-gradient(circle at 92% 0%,rgba(27,76,82,.42),transparent 28%),
        linear-gradient(180deg,var(--deep) 0%,var(--mid) 100%);
      padding-bottom:calc(122px + env(safe-area-inset-bottom));
    }
    button,a{font:inherit}
    button{cursor:pointer}
    .page{width:min(820px,100%);margin:0 auto}
    .top{
      position:sticky;top:0;z-index:30;
      padding:18px 22px 11px;
      background:linear-gradient(180deg,rgba(0,16,18,.99),rgba(0,25,27,.97));
      border-bottom:1px solid rgba(49,84,86,.62);
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    }
    .top-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
    .title-wrap{display:flex;align-items:center;gap:11px;min-width:0}
    .back-home{
      width:42px;height:42px;flex:none;border-radius:50%;
      display:grid;place-items:center;text-decoration:none;
      background:var(--surface);border:1px solid var(--line);color:var(--white);
      box-shadow:0 8px 24px rgba(0,0,0,.14);
    }
    .back-home svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .folder{
      width:25px;height:19px;border-radius:3px;position:relative;flex:none;background:var(--chrome);
      box-shadow:0 6px 18px rgba(223,255,78,.08)
    }
    .folder:before{content:"";position:absolute;left:1px;top:-5px;width:12px;height:7px;border-radius:3px 3px 0 0;background:var(--yellow)}
    h1{margin:0;font-size:26px;line-height:1;font-weight:700;letter-spacing:-.55px}
    .layout-toggle{
      display:flex;gap:3px;padding:4px;border-radius:17px;
      background:var(--surface);border:1px solid var(--line)
    }
    .layout-toggle button{
      width:40px;height:40px;border:0;border-radius:13px;background:transparent;color:#9db2b1;
      display:grid;place-items:center
    }
    .layout-toggle button.on{background:var(--chrome);color:var(--deep)}
    .layout-toggle svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}

    .filters{
      display:flex;gap:9px;overflow:auto;scrollbar-width:none;
      padding:14px 22px 4px;margin:0 -22px;
      overscroll-behavior-inline:contain
    }
    .filters::-webkit-scrollbar{display:none}
    .filter{
      flex:none;height:46px;border-radius:14px;padding:0 16px;
      border:1px solid rgba(49,84,86,.75);background:var(--surface);color:var(--white);
      display:flex;align-items:center;gap:8px;white-space:nowrap;
      font-size:15px;font-weight:500
    }
    .filter.on{
      border-color:transparent;background:var(--chrome);color:var(--deep);
      box-shadow:0 8px 22px rgba(223,255,78,.08)
    }
    .filter svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}

    .status{
      min-height:20px;margin:13px 22px 0;color:var(--muted);
      font-size:13px;font-weight:500;line-height:1.45
    }
    .groups{padding:2px 22px 22px}
    .group{margin-top:23px}
    .group-title{
      margin:0 0 15px;color:var(--white);
      font-size:18px;font-weight:700;letter-spacing:-.3px
    }
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .grid.list{grid-template-columns:1fr;gap:10px}
    .tile{
      position:relative;aspect-ratio:1;border:1px solid rgba(49,84,86,.48);
      padding:0;border-radius:15px;overflow:hidden;background:var(--surface);color:var(--white);
      box-shadow:0 8px 24px rgba(0,0,0,.08)
    }
    .grid.list .tile{aspect-ratio:auto;min-height:88px;display:grid;grid-template-columns:88px 1fr}
    .tile img,.tile video{width:100%;height:100%;display:block;object-fit:cover;background:var(--surface)}
    .grid.list .tile img,.grid.list .tile video{width:88px;height:88px}
    .tile video{pointer-events:none}
    .audio-art{
      width:100%;height:100%;display:grid;place-items:center;
      background:
        radial-gradient(circle at 50% 38%,rgba(223,255,78,.13),transparent 35%),
        linear-gradient(145deg,var(--light),var(--surface))
    }
    .audio-art svg{width:34%;height:34%;stroke:var(--lime);fill:none;stroke-width:1.5}
    .list-copy{display:none;text-align:left;padding:14px;min-width:0}
    .grid.list .list-copy{display:block}
    .list-copy b{
      display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
    }
    .list-copy span{display:block;margin-top:7px;color:var(--muted);font-size:13px;font-weight:500}
    .kind-badge{
      position:absolute;left:7px;bottom:7px;padding:4px 8px;border-radius:999px;
      background:rgba(0,16,18,.80);border:1px solid rgba(49,84,86,.52);backdrop-filter:blur(8px);
      color:var(--white);font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.02em
    }
    .grid.list .kind-badge{display:none}
    .processing{
      background:
        radial-gradient(circle at 50% 42%,rgba(223,255,78,.09),transparent 37%),
        linear-gradient(145deg,var(--surface),var(--mid))
    }
    .processing-inner{position:absolute;inset:0;display:grid;place-items:center}
    .spinner{
      width:38px;height:38px;border-radius:50%;
      border:3px solid rgba(49,84,86,.70);border-top-color:var(--lime);border-right-color:var(--yellow);
      animation:spin .82s linear infinite;
      box-shadow:0 0 22px rgba(223,255,78,.08)
    }
    .processing small{
      position:absolute;left:8px;right:8px;bottom:10px;
      color:var(--muted);font-size:11px;font-weight:500;text-align:center
    }
    .failed{background:#2a1518}
    .failed .processing-inner{color:#ffb8b8;font-size:13px;font-weight:500;padding:12px;text-align:center}
    @keyframes spin{to{transform:rotate(360deg)}}

    .empty{
      padding:72px 26px;text-align:center;color:var(--muted);
      font-size:15px;font-weight:500;line-height:1.55
    }
    .continue{
      position:fixed;z-index:45;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);
      min-height:50px;padding:0 21px;border-radius:17px;border:0;
      background:var(--chrome);color:var(--deep);text-decoration:none;
      display:flex;align-items:center;gap:10px;white-space:nowrap;
      font-size:16px;font-weight:700;
      box-shadow:0 8px 0 rgba(111,133,12,.62),0 15px 30px rgba(223,255,78,.08)
    }
    .continue i{font-style:normal;font-size:23px;line-height:1}

    .detail{
      position:fixed;inset:0;z-index:100;display:none;overflow:auto;padding-bottom:34px;
      background:
        radial-gradient(circle at 90% 0%,rgba(27,76,82,.34),transparent 26%),
        linear-gradient(180deg,var(--deep),var(--mid))
    }
    .detail.open{display:block}
    .detail-inner{width:min(760px,100%);margin:0 auto;padding:18px 22px 42px}
    .detail-close{
      position:sticky;top:14px;z-index:4;margin-left:auto;width:48px;height:48px;border-radius:50%;
      border:1px solid var(--line);background:var(--surface);color:var(--white);display:grid;place-items:center
    }
    .detail-close:before,.detail-close:after{content:"";position:absolute;width:21px;height:1.7px;background:currentColor}
    .detail-close:before{transform:rotate(45deg)}.detail-close:after{transform:rotate(-45deg)}
    .hero-media{margin:30px auto 26px;width:min(72vw,500px);max-height:67svh;display:grid;place-items:center}
    .hero-media img,.hero-media video{max-width:100%;max-height:67svh;border-radius:14px;object-fit:contain;border:1px solid rgba(49,84,86,.5)}
    .hero-media audio{width:100%}
    .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
    .action{
      min-height:84px;border-radius:16px;border:1px solid rgba(49,84,86,.58);
      background:var(--surface);color:var(--white);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
      font-size:16px;font-weight:700
    }
    .action.primary{border-color:transparent;background:var(--chrome);color:var(--deep)}
    .action svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7}
    .prompt-card,.details{
      border-radius:18px;background:var(--surface);border:1px solid rgba(49,84,86,.58)
    }
    .prompt-card{padding:16px;margin-top:12px}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;color:var(--muted)}
    .card-head b,.details-title{font-size:15px;font-weight:500;letter-spacing:.02em}
    .copy{
      height:38px;padding:0 13px;border:1px solid var(--line);border-radius:10px;
      background:var(--mid);color:var(--white);font-size:16px;font-weight:700
    }
    .prompt-box{
      background:var(--mid);border:1px solid rgba(49,84,86,.45);border-radius:14px;
      padding:17px;color:var(--white);font-size:16px;line-height:1.55;font-weight:500;white-space:pre-wrap
    }
    .prompt-box.collapsed{max-height:210px;overflow:hidden;mask-image:linear-gradient(to bottom,#000 72%,transparent)}
    .see{margin-top:10px;border:0;background:none;color:var(--lime);font-size:13px;font-weight:500}
    .details{padding:15px 18px;margin-top:12px}
    .details-title{color:var(--muted);margin-bottom:12px}
    .detail-row{
      display:flex;justify-content:space-between;gap:20px;padding:7px 0;
      font-size:15px;font-weight:500
    }
    .detail-row span:first-child{color:var(--muted)}
    .detail-row span:last-child{text-align:right;color:var(--white)}
    @media(max-width:520px){
      .top{padding:16px 14px 10px}
      .filters{padding-left:14px;padding-right:14px;margin-left:-14px;margin-right:-14px}
      .groups{padding-left:14px;padding-right:14px}.status{margin-left:14px;margin-right:14px}
      .back-home{width:40px;height:40px}.folder{width:23px;height:18px}
      .group{margin-top:21px}.group-title{font-size:17px;margin-bottom:14px}.grid{gap:8px}.tile{border-radius:14px}
      .detail-inner{padding:16px 14px 34px}.hero-media{width:min(86vw,500px);margin-top:24px}
      .actions{gap:8px}.action{min-height:80px;font-size:14px}
    }
  </style>
</head>
<body data-page="library">
  <main class="page">
    <header class="top">
      <div class="top-row">
        <div class="title-wrap">
          <a class="back-home" href="home.html" aria-label="Back to Home">
            <svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
          </a>
          <span class="folder" aria-hidden="true"></span>
          <h1>Library</h1>
        </div>
        <div class="layout-toggle" aria-label="Library layout">
          <button id="listView" type="button" aria-label="List view"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg></button>
          <button id="gridView" class="on" type="button" aria-label="Grid view"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
        </div>
      </div>
      <nav class="filters" id="filters" aria-label="Library filters">
        <button class="filter on" data-filter="all"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="9" rx="1"/><rect x="9" y="10" width="11" height="9" rx="1"/></svg>All</button>
        <button class="filter" data-filter="video"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg>Video</button>
        <button class="filter" data-filter="image"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m6 17 4-4 3 3 2-2 3 3"/></svg>Image</button>
        <button class="filter" data-filter="audio"><svg viewBox="0 0 24 24"><path d="M5 12v4M9 8v8M13 5v14M17 9v6M21 11v2"/></svg>Audio</button>
        <button class="filter" data-filter="twin"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><circle cx="16" cy="10" r="2.5"/><path d="M3 20c0-4 2.6-6 6-6s6 2 6 6M13 16c.8-1.4 2-2 3.5-2 2.5 0 4.5 1.8 4.5 5"/></svg>Twin</button>
      </nav>
    </header>

    <div class="status" id="libraryStatus" role="status"></div>
    <section class="groups" id="libraryGroups"></section>
  </main>

  <a class="continue" href="studio.html"><i>✦</i> Continue to Create</a>

  <section class="detail" id="detail" aria-hidden="true">
    <div class="detail-inner">
      <button class="detail-close" id="detailClose" type="button" aria-label="Close"></button>
      <div class="hero-media" id="detailMedia"></div>

      <div class="actions">
        <button class="action primary" id="editAction" type="button">
          <svg viewBox="0 0 24 24"><path d="m4 20 4-1 11-11-3-3L5 16z"/><path d="m14 6 3 3"/></svg><span>Edit</span>
        </button>
        <button class="action" id="recreateAction" type="button">
          <svg viewBox="0 0 24 24"><path d="M19 7V3l-3 3a7 7 0 1 0 2 10"/><path d="M5 17v4l3-3"/></svg><span>Recreate</span>
        </button>
        <button class="action" id="videoAction" type="button">
          <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg><span>Create Video</span>
        </button>
        <button class="action" id="favAction" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 20s-8-4.7-8-10a4 4 0 0 1 7-2.6A4 4 0 0 1 18 10c0 5.3-6 10-6 10z"/></svg><span>Favourite</span>
        </button>
        <button class="action" id="downloadAction" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg><span>Download</span>
        </button>
        <button class="action" id="moreAction" type="button">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg><span>More</span>
        </button>
      </div>

      <div class="prompt-card">
        <div class="card-head"><b>PROMPT</b><button class="copy" id="copyPrompt" type="button">Copy</button></div>
        <div class="prompt-box collapsed" id="detailPrompt"></div>
        <button class="see" id="seePrompt" type="button">See all⌄</button>
      </div>

      <div class="details">
        <div class="details-title">ⓘ &nbsp; DETAILS</div>
        <div class="detail-row"><span>Model</span><span id="detailModel">—</span></div>
        <div class="detail-row"><span>Type</span><span id="detailKind">—</span></div>
        <div class="detail-row"><span>Aspect</span><span id="detailAspect">—</span></div>
        <div class="detail-row"><span>Credits</span><span id="detailCredits">—</span></div>
        <div class="detail-row"><span>Created</span><span id="detailCreated">—</span></div>
      </div>
    </div>
  </section>

  <script src="fuse-shell.js?v=footer-unified-7" defer></script>
  <script src="library.js?v=library-unified-2" defer></script>
</body>
</html>
