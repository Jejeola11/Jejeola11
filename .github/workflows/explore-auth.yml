jobs:
  account-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --test tests/explore-auth.test.cjs tests/course-funnel.test.cjs
