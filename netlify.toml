# Fuse Studio — Netlify configuration
[build]
  publish = "."
  functions = "netlify/functions"
  # Build isolation: skip the Fuse Studio build entirely when a push only
  # touched pitchpilot/ (PitchPilot deploys as its own site with its own base
  # dir and auto-skips when pitchpilot/ is untouched). Every skipped build =
  # build-minute credits saved on the free plan.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)pitchpilot'"

[build.environment]
  # The Supabase anon key + URL are PUBLIC by design (front-end safe; the
  # database is protected by Row Level Security). Tell Netlify's secret
  # scanner not to flag them, so deploys don't fail on a false positive.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"
  # @ffmpeg-installer/ffmpeg + @ffprobe-installer/ffprobe ship a compiled
  # binary that's read from disk at runtime (path.join(__dirname, ...)), not
  # require()'d — so esbuild's dependency-graph bundling has no way to know
  # it needs to ship that file, and it silently gets left out of the deploy
  # even though everything works in local/CI tests where node_modules is
  # fully present. external_node_modules is Netlify's documented mechanism
  # for exactly this case (native binaries / dynamic-path packages): it skips
  # bundling these and ships their real, unmodified package directories
  # (binary included) alongside the function instead.
  # @napi-rs/canvas is the same story — a native .node binary for its
  # platform package (@napi-rs/canvas-linux-x64-gnu), loaded dynamically.
  external_node_modules = ["@ffmpeg-installer/ffmpeg", "@ffmpeg-installer/linux-x64", "@ffprobe-installer/ffprobe", "@ffprobe-installer/linux-x64", "@napi-rs/canvas", "@napi-rs/canvas-linux-x64-gnu"]

# ---- Clean routes for the hosted app ----
# The new Fuse Studio landing is the front door.
[[redirects]]
  from = "/"
  to = "/app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "/app/studio.html"
  status = 200

# Fuse Atelier 2.0 sales page lives on its own dedicated site (atelier-site/).
[[redirects]]
  from = "/atelier"
  to = "https://fuse-atelier.netlify.app"
  status = 302
  force = true

[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

