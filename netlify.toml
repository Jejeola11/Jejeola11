# Fuse Atelier — Netlify configuration
[build]
  publish = "."
  functions = "netlify/functions"
  # Build isolation: skip this build when a push only touched pitchpilot/.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)pitchpilot'"

[build.environment]
  # These two Supabase values are public frontend configuration by design.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"
  # IMPORTANT: do NOT set native packages in global external_node_modules here.
  # The previous configuration force-copied ffmpeg + canvas native packages into
  # every one of the app's many function bundles. On a fresh Netlify build this
  # multiplied the native binaries dozens of times and exhausted the build disk
  # (ENOSPC). Normal esbuild dependency tracing is used for this recovery deploy.
  # Media functions that genuinely need a native binary can be scoped separately
  # after the core app is online and tested.

# ---- Clean routes for the hosted app ----
[[redirects]]
  from = "/"
  to = "/app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "/app/studio.html"
  status = 200

[[redirects]]
  from = "/atelier"
  to = "/atelier-site/index.html"
  status = 200
  force = true

[[redirects]]
