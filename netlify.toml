  status = 200
  force = true

[[redirects]]
  from = "/atelier-b/*"
  to = "/atelier-site/:splat"
  status = 200

# Fuse Atelier Starter-only landing page (single-tier squeeze page for the
# ₦10,000 tier, same structure/pattern as /atelier-b above but scoped to
