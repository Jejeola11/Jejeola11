# Fuse Studio — Netlify configuration
[build]
  publish = "."
  functions = "netlify/functions"
  # Build isolation: skip the Fuse Studio build entirely when a push only
  # touched pitchpilot/ (PitchPilot deploys as its own site with its own base
  # dir and auto-skips when pitchpilot/ is untouched). Every skipped build =
  # build-minute credits saved on the free plan.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)pitchpilot'"

[build.environment]
  # The Supabase anon key + URL are PUBLIC by design (front-end safe; the
  # database is protected by Row Level Security). Tell Netlify's secret
  # scanner not to flag them, so deploys don't fail on a false positive.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"
  # @ffmpeg-installer/ffmpeg ships a compiled binary that's read from disk at
  # runtime (path.join(__dirname, ...)), not require()'d — so esbuild's
  # dependency-graph bundling has no way to know it needs to ship that file,
  # and it silently gets left out of the deploy even though everything works
  # in local/CI tests where node_modules is fully present. external_node_modules
  # is Netlify's documented mechanism for exactly this case (native binaries /
  # dynamic-path packages): it skips bundling these and ships their real,
  # unmodified package directories (binary included) alongside the function.
  # @napi-rs/canvas is the same story — a native .node binary for its
  # platform package (@napi-rs/canvas-linux-x64-gnu), loaded dynamically.
  #
  # NOTE: this list is applied to EVERY function's bundle (global [functions]
  # scope), so each package here adds its full size to all ~66 function
  # bundles the build stages on disk. @ffprobe-installer (~76MB) was removed
  # entirely once no code needed it — probeDuration/probeDimensions now parse
  # ffmpeg's own "-i" banner (see _ffmpeg.js) — which cut ~76MB off every
  # single bundle and is what got the build back under Netlify's disk ceiling
  # after adding a new function first tipped it over.
  external_node_modules = ["@ffmpeg-installer/ffmpeg", "@ffmpeg-installer/linux-x64", "@napi-rs/canvas", "@napi-rs/canvas-linux-x64-gnu"]

# ---- Clean routes for the hosted app ----
# The new Fuse Studio landing is the front door.
[[redirects]]
  from = "/"
  to = "/app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/studio"
  to = "/app/studio.html"
  status = 200

# Fuse Atelier sales page — served on THIS same domain/site at /atelier
# (no second Netlify site needed). publish = "." already exposes
# atelier-site/ as real files; these three rules just rewrite the clean
# /atelier URL to it while keeping its own relative asset paths
# (assets/*, proof/*) working, since the browser resolves those against
# whatever URL is in the address bar. All three are 200 rewrites (proxy,
# not redirect) -- a 301 here previously bounced /atelier -> /atelier/
# and back, since Netlify's redirect matching didn't treat the trailing
# slash as a different path, so the browser looped forever
# (ERR_TOO_MANY_REDIRECTS). A 200 never changes the URL the browser
# sees, so that loop can't happen.
[[redirects]]
  from = "/atelier"
  to = "/atelier-site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/atelier/"
  to = "/atelier-site/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/atelier/*"
  to = "/atelier-site/:splat"
  status = 200

# Fuse Atelier landing-page A/B test, Variant B (single flat-price bundle
# instead of the 3-tier menu) -- same folder, same 200-rewrite pattern as
# /atelier above. Real content, real testimonials, real proof -- just a
# different structure/offer to test against the original at /atelier.
[[redirects]]
  from = "/atelier-b"
  to = "/atelier-site/index-b.html"
  status = 200
  force = true

[[redirects]]
  from = "/atelier-b/"
