# Fuse Studio — Netlify configuration
[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # The Supabase anon key + URL are PUBLIC by design (front-end safe; the
  # database is protected by Row Level Security). Tell Netlify's secret
  # scanner not to flag them, so deploys don't fail on a false positive.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_ANON_KEY,SUPABASE_URL"

[functions]
  node_bundler = "esbuild"
  # Paystack webhook needs the raw body for signature verification.
  included_files = []

# ---- Clean routes for the hosted app ----
# The BIO 208 biostatistics study guide is the front door.
[[redirects]]
  from = "/"
  to = "/BIO208_BIOSTATISTICS_ULTIMATE_GUIDE.html"
  status = 200
  force = true

# Short, easy-to-type routes for the study materials.
[[redirects]]
  from = "/bio208"
  to = "/BIO208_BIOSTATISTICS_ULTIMATE_GUIDE.html"
  status = 200

[[redirects]]
  from = "/tables"
  to = "/BIO208_TABLE_CHEATSHEET.html"
  status = 200

# Fuse Studio stays reachable for reference.
[[redirects]]
  from = "/fuse"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/studio"
  to = "/app/studio.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 200

# Old funnels stay reachable for reference / paid traffic already in flight.
[[redirects]]
  from = "/legacy"
  to = "/index.html"
  status = 200
